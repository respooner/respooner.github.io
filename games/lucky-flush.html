<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky Flush · Mini Arcade</title>
<meta name="description" content="A poker roguelite: play hands, stack Chips and Mult with jokers, beat ever-bigger blinds.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101436'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23ff4d6d'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="games.js"></script>
<style>
/* Lucky Flush: dark casino-arcade surface. Desktop: stats rail on the left, table on the right
   (jokers row, play area, hand, actions). Phones: the rail collapses into a compact strip on top. */
:root {
  --bg: #0b0e24; --panel: rgb(255 255 255 / .06); --panel-2: rgb(255 255 255 / .11); --line: rgb(255 255 255 / .13);
  --text: #f1efff; --dim: #a7a6cf; --chips: #2f8cff; --mult: #ff3d5e; --money: #ffc53d; --good: #46e6a0;
  --paper: #fbf7ee; --red: #e0293f; --black: #1d2238;
  --display: "Bricolage Grotesque", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  --cw: clamp(56px, 8.4vw, 92px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; overflow-x: clip; }
body { background: var(--bg); color: var(--text); font: 400 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
.swirl { position: fixed; inset: -30%; z-index: -2; pointer-events: none; filter: blur(60px) saturate(1.2); opacity: .55;
  background: conic-gradient(from 0deg at 50% 50%, #3a1c71, #143d8f, #0d6b6b, #5b1a5e, #8c1d3a, #3a1c71); animation: spin 60s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: repeating-linear-gradient(0deg, rgb(0 0 0 / .14) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 50%, rgb(0 0 0 / .55)); }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.05; }
p { margin: 0; }
.mono { font-family: var(--mono); } .dim { color: var(--dim); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 12px; border: 0; font-weight: 700; letter-spacing: .01em;
  background: var(--panel-2); box-shadow: 0 4px 0 rgb(0 0 0 / .35); transition: transform .1s, filter .15s, box-shadow .1s; text-decoration: none; }
.btn:hover { filter: brightness(1.15); } .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgb(0 0 0 / .35); }
.btn.blue { background: #2f6fff; } .btn.red { background: #e8334f; } .btn.gold { background: #f2a516; color: #2a1800; } .btn.green { background: #19b46b; }
.btn[disabled] { opacity: .35; filter: grayscale(1); pointer-events: none; }

.hud { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 8px 14px; white-space: nowrap; background: rgb(8 10 28 / .7); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.hud a { font: 500 13px var(--mono); color: var(--dim); text-decoration: none; padding: 6px 8px; border-radius: 8px; }
.hud a:hover { color: var(--text); background: var(--panel); }
.hud .logo { font: 800 20px var(--display); letter-spacing: -.02em; background: linear-gradient(90deg, #ff5e7e, #ffc53d, #46e6a0, #4fa8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hud .sp { flex: 1; }
.hud .ib { padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 600; }

.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; max-width: 1280px; margin: 0 auto; padding: 14px; min-height: calc(100vh - 52px); }
/* ---------- rail ---------- */
.rail { display: grid; gap: 10px; align-content: start; }
.box { background: rgb(10 12 34 / .72); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; backdrop-filter: blur(8px); }
.blind { display: grid; gap: 4px; text-align: center; position: relative; overflow: hidden; }
.blind .bchip { width: 54px; height: 54px; margin: 0 auto 2px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; border: 4px dashed rgb(255 255 255 / .5); }
.blind .bname { font: 800 20px var(--display); }
.blind .bdesc { font-size: 12px; color: #ffb3c0; min-height: 0; }
.blind .target { font: 600 13px var(--mono); color: var(--dim); }
.blind .target b { display: block; font: 800 28px var(--display); color: var(--mult); }
.rscore { display: flex; justify-content: space-between; align-items: center; }
.rscore b { font: 800 28px var(--display); font-variant-numeric: tabular-nums; }
.rscore.hot b { color: #ffcf5a; text-shadow: 0 0 18px #ff7a00; }
.handinfo { text-align: center; display: grid; gap: 8px; }
.handinfo .htype { font: 800 20px var(--display); min-height: 26px; }
.handinfo .htype small { font: 500 12px var(--mono); color: var(--dim); }
.cm { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
.cm div { padding: 8px 6px; border-radius: 10px; font: 800 26px var(--display); font-variant-numeric: tabular-nums; text-align: center; transition: transform .1s; }
.cm .chips { background: var(--chips); text-align: right; box-shadow: inset 0 -4px 0 rgb(0 0 0 / .2); }
.cm .mult { background: var(--mult); text-align: left; box-shadow: inset 0 -4px 0 rgb(0 0 0 / .2); }
.cm span { font: 800 22px var(--display); color: var(--mult); }
.bump { animation: bump .18s; }
@keyframes bump { 50% { transform: scale(1.18); } }
.fire { position: relative; }
.fire::before { content: ""; position: absolute; inset: -8px -4px auto; height: 26px; background: radial-gradient(ellipse at bottom, #ffb02e, #ff4d00 40%, transparent 70%); filter: blur(4px); animation: flick .18s infinite alternate; z-index: -1; border-radius: 50%; }
@keyframes flick { to { transform: scaleY(1.3) translateY(-3px); opacity: .7; } }
.counters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.counters div { background: rgb(0 0 0 / .3); border-radius: 12px; padding: 8px; text-align: center; }
.counters span { display: block; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.counters b { font: 800 24px var(--display); }
.counters .h b { color: var(--chips); } .counters .d b { color: var(--mult); } .counters .m b { color: var(--money); }
.railbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ---------- table ---------- */
.table { display: grid; grid-template-rows: auto 1fr auto auto; gap: 10px; min-width: 0; }
.jrow { display: flex; gap: 10px; align-items: flex-start; min-height: calc(var(--cw) * 1.4 + 24px); padding: 10px; border-radius: 16px; background: rgb(0 0 0 / .25); border: 1px dashed var(--line); position: relative; }
.jrow .count { position: absolute; right: 10px; bottom: 6px; font: 600 12px var(--mono); color: var(--dim); }
.joker { position: relative; width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: calc(var(--cw) * .1); flex: none; cursor: pointer; user-select: none;
  background: linear-gradient(160deg, #6b4bd8, #2e1f6b); border: 3px solid #ece6ff; box-shadow: 0 8px 18px -6px rgb(0 0 0 / .7);
  display: grid; grid-template-rows: 1fr auto; place-items: center; padding: 4px; transition: transform .15s; }
.joker.r1 { background: linear-gradient(160deg, #2d8bd8, #183f7a); } .joker.r2 { background: linear-gradient(160deg, #20b07a, #0f5a45); } .joker.r3 { background: linear-gradient(160deg, #ff5a7a, #8a1e57); border-color: #ffe08a; }
.joker .ja { font-size: calc(var(--cw) * .48); filter: drop-shadow(0 4px 6px rgb(0 0 0 / .4)); }
.joker .jn { font: 700 calc(var(--cw) * .12)/1.1 var(--display); text-align: center; }
.joker:hover, .joker.sel { transform: translateY(-6px) rotate(-2deg); }
.joker.sel { outline: 3px solid var(--money); outline-offset: 2px; }
.joker.wiggle { animation: wiggle .35s; }
@keyframes wiggle { 25% { transform: rotate(-9deg) scale(1.1); } 75% { transform: rotate(7deg) scale(1.1); } }
.joker .badge { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); font: 700 11px var(--mono); padding: 2px 7px; border-radius: 99px; background: #0b0e24; border: 1px solid var(--line); white-space: nowrap; }
.tip { position: absolute; z-index: 40; left: 50%; top: calc(100% + 14px); transform: translateX(-50%); width: 190px; padding: 10px; border-radius: 12px; background: #fbf7ee; color: #1d2238; font-size: 13px; line-height: 1.35; text-align: center; box-shadow: 0 10px 30px rgb(0 0 0 / .5); pointer-events: none; }
.tip b { display: block; font: 800 15px var(--display); margin-bottom: 2px; }
.tip .tbtns { display: flex; gap: 6px; justify-content: center; margin-top: 8px; pointer-events: auto; }
.tip .tbtns button { padding: 5px 9px; border-radius: 8px; border: 0; font-weight: 700; font-size: 12px; background: #e3ddcc; color: #1d2238; }
.tip .tbtns .sell { background: #19b46b; color: #fff; }
.joker:hover .tip.hov { display: block; }
.tip.hov { display: none; }
.pop { position: absolute; z-index: 45; left: 50%; top: -14px; transform: translate(-50%, -100%); padding: 3px 9px; border-radius: 8px; font: 800 15px var(--display); white-space: nowrap; pointer-events: none; animation: popup .7s ease-out forwards; color: #fff; box-shadow: 0 4px 10px rgb(0 0 0 / .4); }
.pop.c { background: var(--chips); } .pop.m { background: var(--mult); } .pop.x { background: #b02ef0; } .pop.g { background: var(--money); color: #2a1800; }
@keyframes popup { 0% { opacity: 0; transform: translate(-50%, -60%) scale(.5); } 20% { opacity: 1; transform: translate(-50%, -100%) scale(1.15); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -150%); } }

.main { display: grid; place-items: center; min-height: 200px; position: relative; }
.playarea { display: flex; justify-content: center; gap: 8px; min-height: calc(var(--cw) * 1.4 + 30px); align-items: center; }
.hand { display: flex; justify-content: center; align-items: flex-end; min-height: calc(var(--cw) * 1.4 + 34px); padding-top: 26px; }
.actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
.actions .btn { min-width: 110px; }
.deckpill { font: 600 12px var(--mono); color: var(--dim); align-self: center; padding: 6px 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }

/* ---------- playing cards ---------- */
.pc { position: relative; width: var(--cw); height: calc(var(--cw) * 1.4); flex: none; border-radius: calc(var(--cw) * .09); background: var(--paper); color: var(--black);
  box-shadow: 0 1px 0 #d8d0bb, 0 3px 0 #c9bfa5, 0 10px 18px -6px rgb(0 0 0 / .6); cursor: pointer; user-select: none; transition: transform .14s cubic-bezier(.2,.8,.3,1.3), filter .2s; }
.hand .pc { margin: 0 calc(var(--ov, 0px) * -1); transform: rotate(var(--r, 0deg)) translateY(var(--y, 0px)); }
.hand .pc:hover { transform: translateY(-10px) rotate(var(--r, 0deg)); z-index: 5; }
.hand .pc.sel { transform: translateY(-30px); z-index: 6; box-shadow: 0 0 0 3px var(--money), 0 16px 24px -8px rgb(0 0 0 / .7); }
.pc.red { color: var(--red); }
.pc .tl, .pc .br { position: absolute; display: grid; justify-items: center; line-height: .9; font: 800 calc(var(--cw) * .2) var(--display); }
.pc .tl { left: 6%; top: 5%; } .pc .br { right: 6%; bottom: 5%; transform: rotate(180deg); }
.pc .tl i, .pc .br i { font-style: normal; font-size: .8em; }
.pc .mid { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--cw) * .5); }
.pc .mid.face { font-size: calc(var(--cw) * .42); }
.pc.face-card { background: linear-gradient(160deg, #fffaf0, #f3e7c8); }
.pc.debuff { filter: grayscale(1) brightness(.6); }
.pc.debuff::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--cw) * .7); color: rgb(224 41 63 / .7); }
.pc.scoring { animation: lift .25s forwards; }
@keyframes lift { to { transform: translateY(-18px); } }
.pc.deal { animation: deal .3s backwards; animation-delay: var(--dl); }
@keyframes deal { from { opacity: 0; transform: translate(60px, -40px) rotate(18deg); } }
.pc.gone { animation: gone .3s forwards; }
@keyframes gone { to { opacity: 0; transform: translateY(-40px) rotate(8deg) scale(.8); } }
.pc .pop { top: -8px; }

/* ---------- overlay panels (blind select, cash out, shop, end) ---------- */
.panel { width: 100%; display: grid; gap: 16px; justify-items: center; text-align: center; padding: 10px 0 20px; }
.panel h2 { font-size: clamp(28px, 4.5vw, 40px); }
.blinds { display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); gap: 12px; justify-content: center; width: 100%; }
.bcard { display: grid; gap: 6px; justify-items: center; padding: 16px 12px; border-radius: 18px; background: rgb(10 12 34 / .78); border: 1px solid var(--line); opacity: .5; }
.bcard.now { opacity: 1; border-color: var(--money); box-shadow: 0 0 30px -8px var(--money); }
.bcard.done { opacity: .35; }
.bcard .bchip { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; border: 4px dashed rgb(255 255 255 / .5); }
.bcard b.t { font: 800 26px var(--display); color: var(--mult); }
.bcard small { color: var(--dim); }
.bcard .bd { font-size: 13px; color: #ffb3c0; min-height: 36px; }
.cash { width: min(100%, 420px); display: grid; gap: 6px; }
.cash div { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 10px; background: rgb(0 0 0 / .3); }
.cash div b { color: var(--money); font-family: var(--mono); }
.cash .total { background: rgb(255 197 61 / .14); font-weight: 700; }
.shop { display: grid; gap: 16px; width: 100%; justify-items: center; }
.shelf { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; padding: 14px; border-radius: 18px; background: rgb(0 0 0 / .28); border: 1px solid var(--line); }
.item { display: grid; gap: 8px; justify-items: center; width: calc(var(--cw) + 60px); }
.item .desc { font-size: 12px; color: var(--dim); min-height: 48px; }
.item .nm { font: 700 14px var(--display); }
.price { font: 800 14px var(--mono); color: var(--money); }
.item.sold { opacity: .25; pointer-events: none; }
.tome { width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: calc(var(--cw) * .1); display: grid; place-items: center; font-size: calc(var(--cw) * .45);
  background: linear-gradient(160deg, #ffcf5a, #c96b00); border: 3px solid #fff3cf; box-shadow: 0 8px 18px -6px rgb(0 0 0 / .7); }
.tome.voucher { background: linear-gradient(160deg, #e05cff, #5b1aa8); border-color: #f5d0ff; }
.levels { width: min(100%, 520px); display: grid; gap: 4px; text-align: left; }
.levels div { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 10px; background: rgb(0 0 0 / .3); font-size: 14px; }
.levels .lv { font: 700 12px var(--mono); color: var(--money); }
.levels .cmv span:first-child { color: #8cc0ff; } .levels .cmv span:last-child { color: #ff8da0; }
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: start center; padding: 50px 16px; overflow-y: auto; background: rgb(4 5 18 / .8); backdrop-filter: blur(6px); }
.modal .box { width: min(100%, 760px); display: grid; gap: 14px; }
.notes ul { padding-left: 20px; margin: 0; display: grid; gap: 8px; color: #dcdaf5; }
.notes code { font: 500 .9em var(--mono); background: rgb(255 255 255 / .08); padding: 1px 5px; border-radius: 5px; }
.deckgrid { --cw: 46px; display: grid; gap: 8px; }
.deckgrid .row { display: flex; flex-wrap: wrap; gap: 4px; }
.deckgrid .pc { cursor: default; }
.deckgrid .pc.used { opacity: .2; }
.title { display: grid; gap: 18px; justify-items: center; text-align: center; padding: 6vh 16px 30px; max-width: 760px; margin: 0 auto; }
.title h1 { font: 800 clamp(56px, 12vw, 120px)/.9 var(--display); letter-spacing: -.04em; background: linear-gradient(100deg, #ff5e7e, #ffc53d 40%, #46e6a0 70%, #4fa8ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 10px 30px rgb(255 94 126 / .35)); }
.fan { display: flex; justify-content: center; --cw: clamp(64px, 12vw, 96px); height: calc(var(--cw) * 1.6); }
.fan .pc { margin: 0 -12px; transform-origin: 50% 140%; animation: fanin .6s backwards; }
@keyframes fanin { from { transform: rotate(0deg) translateY(30px); opacity: 0; } }
.feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; width: 100%; }
.feat div { text-align: left; padding: 12px 14px; border-radius: 14px; background: rgb(10 12 34 / .7); border: 1px solid var(--line); font-size: 13px; color: var(--dim); }
.feat b { display: block; color: var(--text); font-size: 15px; }
.flash { animation: flashbg .5s; }
@keyframes flashbg { 30% { background: rgb(255 197 61 / .25); } }
.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translate(-6px, 2px); } 40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }

@media (max-width: 860px) {
  .hud { gap: 6px; padding: 6px 10px; } .hud .logo { font-size: 17px; } .hud .ib { padding: 6px 9px; }
  .app { grid-template-columns: 1fr; padding: 8px; gap: 8px; }
  .rail { grid-template-columns: 1fr 1fr; }
  .rail .blind, .rail .handinfo { grid-column: span 1; }
  .blind .bchip { display: none; }
  .blind .target b { font-size: 22px; }
  .cm div { font-size: 20px; padding: 6px 4px; }
  .handinfo .htype { font-size: 16px; }
  .rscore b { font-size: 22px; }
  .counters b { font-size: 18px; }
  .blinds { grid-template-columns: 1fr; max-width: 320px; }
  .bcard { grid-template-columns: auto 1fr; text-align: left; justify-items: start; }
  .bcard .bchip { grid-row: span 3; width: 48px; height: 48px; font-size: 22px; }
  .actions .btn { min-width: 0; padding: 10px 12px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="swirl" aria-hidden="true"></div>
<header class="hud">
  <a href="./">← Arcade</a>
  <span class="logo">LUCKY FLUSH</span>
  <span class="sp"></span>
  <button class="ib" id="b-speed" type="button" title="Animation speed">Speed 1×</button>
  <button class="ib" id="b-notes" type="button" title="How it's built">ⓘ</button>
</header>
<div id="root"></div>
<div class="modal" id="modal" hidden></div>

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
  var rnd = function (n) { return Math.floor(Math.random() * n); };
  var pick = function (a) { return a[rnd(a.length)]; };
  var esc = Arcade.escape;
  var speed = 1;
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms / speed); }); };
  var fmt = function (n) { return n >= 1e11 ? n.toExponential(2) : Math.floor(n).toLocaleString("en"); };
  var root = $("#root"), modal = $("#modal");

  /* ================= cards & hands ================= */
  var SUITS = ["♠", "♥", "♣", "♦"], SUIT_NAMES = ["Spades", "Hearts", "Clubs", "Diamonds"];
  var RANK = { 11: "J", 12: "Q", 13: "K", 14: "A" };
  var FACE = { 11: "🤵", 12: "👸", 13: "🤴" };
  function rl(r) { return RANK[r] || String(r); }
  function chipsOf(c) { return c.r === 14 ? 11 : c.r >= 11 ? 10 : c.r; }

  var HANDS = [
    { k: "high", n: "High Card", c: 5, m: 1, lc: 10, lm: 1 },
    { k: "pair", n: "Pair", c: 10, m: 2, lc: 15, lm: 1 },
    { k: "two", n: "Two Pair", c: 20, m: 2, lc: 20, lm: 1 },
    { k: "three", n: "Three of a Kind", c: 30, m: 3, lc: 20, lm: 2 },
    { k: "straight", n: "Straight", c: 30, m: 4, lc: 30, lm: 3 },
    { k: "flush", n: "Flush", c: 35, m: 4, lc: 15, lm: 2 },
    { k: "full", n: "Full House", c: 40, m: 4, lc: 25, lm: 2 },
    { k: "four", n: "Four of a Kind", c: 60, m: 7, lc: 30, lm: 3 },
    { k: "sflush", n: "Straight Flush", c: 100, m: 8, lc: 40, lm: 4 }
  ];
  var HAND = {}; HANDS.forEach(function (h) { HAND[h.k] = h; });

  // Identify the best poker hand in 1–5 cards and which of them score.
  function evaluate(cards) {
    var n = cards.length, byRank = {};
    cards.forEach(function (c) { (byRank[c.r] = byRank[c.r] || []).push(c); });
    var groups = Object.keys(byRank).map(function (r) { return byRank[r]; })
      .sort(function (a, b) { return b.length - a.length || b[0].r - a[0].r; });
    var flush = n === 5 && cards.every(function (c) { return c.s === cards[0].s; });
    var ranks = Object.keys(byRank).map(Number).sort(function (a, b) { return a - b; });
    var straight = n === 5 && ranks.length === 5 && (ranks[4] - ranks[0] === 4 || ranks.join() === "2,3,4,5,14");
    var g0 = groups[0] ? groups[0].length : 0, g1 = groups[1] ? groups[1].length : 0;
    var has = { pair: g0 >= 2, two: g0 >= 2 && g1 >= 2, three: g0 >= 3, straight: straight, flush: flush, four: g0 >= 4 };
    var type, scoring;
    if (straight && flush) { type = "sflush"; scoring = cards; }
    else if (g0 === 4) { type = "four"; scoring = groups[0]; }
    else if (g0 === 3 && g1 >= 2) { type = "full"; scoring = cards; }
    else if (flush) { type = "flush"; scoring = cards; }
    else if (straight) { type = "straight"; scoring = cards; }
    else if (g0 === 3) { type = "three"; scoring = groups[0]; }
    else if (g0 === 2 && g1 === 2) { type = "two"; scoring = groups[0].concat(groups[1]); }
    else if (g0 === 2) { type = "pair"; scoring = groups[0]; }
    else { type = "high"; scoring = [cards.slice().sort(function (a, b) { return b.r - a.r; })[0]]; }
    // keep table order for scoring animation
    scoring = cards.filter(function (c) { return scoring.indexOf(c) >= 0; });
    return { type: type, scoring: scoring, has: has };
  }

  /* ================= jokers ================= */
  // Hooks: card(c, ctx, j) per scored card; hand(ctx, j) once per hand; cash() at round end.
  // Each returns { chips, mult, xmult, money } (or false for no effect).
  var JOKERS = {
    jester:   { n: "Jester", a: "🃏", r: 1, p: 3, x: "+4 Mult", hand: function () { return { mult: 4 }; } },

    heart:    { n: "Heartthrob", a: "💘", r: 1, p: 5, x: "Played ♥ give +3 Mult when scored", card: function (c) { return c.s === 1 && { mult: 3 }; } },
    club:     { n: "Club Kid", a: "🎧", r: 1, p: 5, x: "Played ♣ give +3 Mult when scored", card: function (c) { return c.s === 2 && { mult: 3 }; } },
    diamond:  { n: "Diamond Hands", a: "💎", r: 1, p: 5, x: "Played ♦ give +3 Mult when scored", card: function (c) { return c.s === 3 && { mult: 3 }; } },
    pairs:    { n: "Double Trouble", a: "👯", r: 1, p: 4, x: "+8 Mult if the hand contains a Pair", hand: function (x) { return x.has.pair && { mult: 8 }; } },
    triple:   { n: "Triple Threat", a: "🔱", r: 2, p: 7, x: "×3 Mult if the hand contains Three of a Kind", hand: function (x) { return x.has.three && { xmult: 3 }; } },
    shooter:  { n: "Straight Shooter", a: "🏹", r: 1, p: 5, x: "+12 Mult if the hand contains a Straight", hand: function (x) { return x.has.straight && { mult: 12 }; } },
    wave:     { n: "Flush Fund", a: "🌊", r: 1, p: 5, x: "+80 Chips if the hand contains a Flush", hand: function (x) { return x.has.flush && { chips: 80 }; } },
    minimal:  { n: "Minimalist", a: "🪶", r: 1, p: 5, x: "+20 Mult if you play 3 or fewer cards", hand: function (x) { return x.played.length <= 3 && { mult: 20 }; } },
    court:    { n: "Royal Court", a: "👑", r: 1, p: 5, x: "Played face cards give +30 Chips when scored", card: function (c) { return c.r >= 11 && c.r <= 13 && { chips: 30 }; } },
    aces:     { n: "Ace in the Hole", a: "🅰️", r: 1, p: 5, x: "Played Aces give +20 Chips and +4 Mult", card: function (c) { return c.r === 14 && { chips: 20, mult: 4 }; } },
    even:     { n: "Even Keel", a: "⚖️", r: 1, p: 5, x: "Played 10, 8, 6, 4, 2 give +4 Mult", card: function (c) { return c.r <= 10 && c.r % 2 === 0 && { mult: 4 }; } },
    odd:      { n: "Odd Couple", a: "🎲", r: 1, p: 5, x: "Played A, 9, 7, 5, 3 give +25 Chips", card: function (c) { return (c.r === 14 || (c.r <= 9 && c.r % 2 === 1)) && { chips: 25 }; } },
    recycler: { n: "Recycler", a: "♻️", r: 1, p: 5, x: "+15 Chips per discard remaining", hand: function () { return R.discards > 0 && { chips: 15 * R.discards }; } },
    piggy:    { n: "Piggy Bank", a: "🐷", r: 1, p: 4, x: "Earn $4 at the end of each round", cash: function () { return 4; } },
    snowball: { n: "Snowball", a: "☃️", r: 2, p: 6, x: "Gains +1 Mult every hand played", stack: 1, hand: function (x, j) { j.v = (j.v || 0) + 1; return { mult: j.v }; } },
    investor: { n: "Investor", a: "📈", r: 2, p: 7, x: "+1 Mult for every $4 you have", hand: function () { return S.money >= 4 && { mult: Math.floor(S.money / 4) }; } },
    lastcall: { n: "Last Call", a: "🍸", r: 2, p: 6, x: "×3 Mult on the final hand of the round", hand: function () { return R.hands === 0 && { xmult: 3 }; } },
    hold:     { n: "Hold Steady", a: "✋", r: 2, p: 6, x: "+3 Mult for each card held in hand", hand: function (x) { return x.held > 0 && { mult: 3 * x.held }; } },
    lucky:    { n: "Lucky Cat", a: "🐱", r: 2, p: 6, x: "Played 7s: 1 in 2 chance for +7 Mult and $2", card: function (c) { return c.r === 7 && Math.random() < .5 && { mult: 7, money: 2 }; } },
    roller:   { n: "High Roller", a: "🎰", r: 2, p: 6, x: "1 in 4 chance for ×5 Mult", hand: function () { return Math.random() < .25 && { xmult: 5 }; } },
    glass:    { n: "Glass Cannon", a: "🍷", r: 3, p: 8, x: "×4 Mult. 1 in 5 chance to shatter after each round", fragile: .2, hand: function () { return { xmult: 4 }; } },
    echo:     { n: "Echo Chamber", a: "🔁", r: 3, p: 8, x: "The first scored card triggers 2 extra times", retrigger: 2 },
    wolf:     { n: "Pack Leader", a: "🐺", r: 3, p: 9, x: "×0.5 Mult for each other Joker (×1 base)", hand: function () { return S.jokers.length > 1 && { xmult: 1 + .5 * (S.jokers.length - 1) }; } }
  };

  var VOUCHERS = {
    hand:    { n: "Overtime", a: "⏱️", x: "+1 hand every round", f: function () { S.maxHands++; } },
    discard: { n: "Shredder", a: "🗑️", x: "+1 discard every round", f: function () { S.maxDiscards++; } },
    size:    { n: "Big Hands", a: "🖐️", x: "+1 hand size", f: function () { S.handSize++; } },
    slot:    { n: "Joker Rack", a: "🗄️", x: "+1 Joker slot", f: function () { S.slots++; } },
    bank:    { n: "Savings Account", a: "🏦", x: "Interest cap raised from $5 to $10", f: function () { S.interestCap = 10; } }
  };

  var BOSSES = [
    { k: "wall", n: "The Wall", a: "🧱", d: "Extra large blind (×2 more)", mul: 2 },
    { k: "suit", n: "The Ban", a: "🚫", d: "", suit: true },
    { k: "needle", n: "The Needle", a: "🪡", d: "Play only 1 hand (smaller target)", hands: 1, mul: .5 },
    { k: "hook", n: "The Hook", a: "🪝", d: "Discards 2 random held cards after each hand", hook: 2 },
    { k: "psychic", n: "The Psychic", a: "🔮", d: "Must play exactly 5 cards", five: true },
    { k: "manacle", n: "The Manacle", a: "⛓️", d: "−1 hand size", size: -1 },
    { k: "flint", n: "The Flint", a: "🪨", d: "Base Chips and Mult are halved", flint: true }
  ];
  var ANTE_BASE = [300, 750, 1800, 4500, 10000, 18000, 32000, 48000];
  function anteBase(a) { return a <= 8 ? ANTE_BASE[a - 1] : Math.round(48000 * Math.pow(1.9, a - 8) / 1000) * 1000; }

  /* ================= state ================= */
  var S = null; // run
  var R = null; // round
  var uid = 1;

  function newRun() {
    S = { ante: 1, blind: 0, money: 4, jokers: [], slots: 5, levels: {}, maxHands: 4, maxDiscards: 3, handSize: 8, interestCap: 5,
          vouchers: [], boss: null, best: 0, handsPlayed: 0, won: false, rerollCost: 5 };
    HANDS.forEach(function (h) { S.levels[h.k] = 1; });
    S.jokers.push({ k: "jester", id: uid++ }); // a free starter so the scoring engine shows off from hand one
    S.boss = rollBoss();
    renderApp();
    showBlinds();
  }
  function rollBoss() {
    var b = Object.assign({}, pick(BOSSES));
    if (b.suit) { b.suitBan = rnd(4); b.d = "All " + SUIT_NAMES[b.suitBan] + " are debuffed"; b.a = SUITS[b.suitBan]; }
    return b;
  }
  function blindInfo(i) {
    var base = anteBase(S.ante);
    if (i === 0) return { n: "Small Blind", a: "🔵", target: base, reward: 3, color: "#2f6fff" };
    if (i === 1) return { n: "Big Blind", a: "🟠", target: Math.round(base * 1.5), reward: 4, color: "#f2a516" };
    var b = S.boss;
    return { n: b.n, a: b.a, target: Math.round(base * 2 * (b.mul || 1)), reward: 5, boss: b, color: "#e8334f", d: b.d };
  }
  function levelVals(k) {
    var h = HAND[k], l = S.levels[k] - 1;
    var c = h.c + h.lc * l, m = h.m + h.lm * l;
    if (R && R.boss && R.boss.flint) { c = Math.max(1, Math.floor(c / 2)); m = Math.max(1, Math.floor(m / 2)); }
    return { c: c, m: m };
  }

  /* ================= layout ================= */
  function renderApp() {
    root.innerHTML =
      '<div class="app"><aside class="rail">' +
        '<div class="box blind" id="blindbox"></div>' +
        '<div class="box rscore" id="rscorebox"><span class="dim">Round score</span><b id="rscore">0</b></div>' +
        '<div class="box handinfo"><div class="htype" id="htype">&nbsp;</div><div class="cm"><div class="chips" id="chips">0</div><span>×</span><div class="mult" id="mult">0</div></div></div>' +
        '<div class="box counters"><div class="h"><span>Hands</span><b id="c-hands">-</b></div><div class="d"><span>Discards</span><b id="c-discs">-</b></div></div>' +
        '<div class="box counters"><div class="m"><span>Money</span><b id="c-money">$0</b></div><div><span>Ante</span><b id="c-ante">1/8</b></div></div>' +
        '<div class="railbtns"><button class="btn" id="b-levels" type="button">Hand levels</button><button class="btn" id="b-deck" type="button">Deck</button></div>' +
      '</aside><section class="table"><div class="jrow" id="jrow"></div><div class="main" id="main"></div><div class="hand" id="hand"></div><div class="actions" id="actions"></div></section></div>';
    $("#b-levels").addEventListener("click", showLevels);
    $("#b-deck").addEventListener("click", showDeck);
    renderJokers(); updateRail();
  }

  function updateRail() {
    if (!S) return;
    var inRound = !!R, bi = blindInfo(inRound ? R.blind : S.blind);
    $("#blindbox").innerHTML = '<div class="bchip" style="background:' + bi.color + '33;border-color:' + bi.color + '">' + bi.a + '</div><div class="bname">' + esc(bi.n) + "</div>" +
      (bi.d ? '<div class="bdesc">' + esc(bi.d) + "</div>" : "") + '<div class="target">Score at least<b>' + fmt(inRound ? R.target : bi.target) + "</b>Reward " + "$".repeat(bi.reward) + "</div>";
    $("#rscore").textContent = fmt(inRound ? R.score : 0);
    $("#c-hands").textContent = inRound ? R.hands : S.maxHands;
    $("#c-discs").textContent = inRound ? R.discards : S.maxDiscards;
    $("#c-money").textContent = "$" + S.money;
    $("#c-ante").textContent = S.ante + (S.ante <= 8 ? "/8" : "");
  }

  function jokerTip(j, withButtons) {
    var d = JOKERS[j.k];
    return '<div class="tip' + (withButtons ? "" : " hov") + '"><b>' + esc(d.n) + "</b>" + esc(d.x) + (d.stack ? " (now +" + (j.v || 0) + ")" : "") +
      (withButtons ? '<div class="tbtns"><button data-act="left" type="button">◀</button><button class="sell" data-act="sell" type="button">Sell $' + sellValue(j) + '</button><button data-act="right" type="button">▶</button></div>' : "") + "</div>";
  }
  function sellValue(j) { return Math.max(1, Math.floor(JOKERS[j.k].p / 2)); }
  function jokerHTML(j, opts) {
    var d = JOKERS[j.k];
    opts = opts || {};
    return '<div class="joker r' + d.r + (opts.sel ? " sel" : "") + '" data-id="' + j.id + '" tabindex="0" role="button" aria-label="' + esc(d.n + ": " + d.x) + '"><div class="ja" aria-hidden="true">' + d.a + '</div><div class="jn">' + esc(d.n) + "</div>" +
      (d.stack ? '<span class="badge">+' + (j.v || 0) + "</span>" : "") + (opts.noTip ? "" : jokerTip(j, opts.sel)) + "</div>";
  }

  var selJoker = null;
  function renderJokers() {
    var row = $("#jrow"); if (!row || !S) return;
    row.innerHTML = S.jokers.map(function (j) { return jokerHTML(j, { sel: selJoker === j.id }); }).join("") +
      (S.jokers.length ? "" : '<span class="dim" style="align-self:center;margin:auto;font-size:14px">Jokers you buy appear here. Order matters: they trigger left to right.</span>') +
      '<span class="count">' + S.jokers.length + "/" + S.slots + "</span>";
    $$(".joker", row).forEach(function (el) {
      el.addEventListener("click", function (e) {
        var act = e.target.dataset && e.target.dataset.act, id = Number(el.dataset.id);
        var idx = S.jokers.findIndex(function (j) { return j.id === id; });
        if (act === "sell") { S.money += sellValue(S.jokers[idx]); S.jokers.splice(idx, 1); selJoker = null; updateRail(); renderJokers(); if (onShopChange) onShopChange(); return; }
        if (act === "left" && idx > 0) { var t = S.jokers[idx - 1]; S.jokers[idx - 1] = S.jokers[idx]; S.jokers[idx] = t; renderJokers(); return; }
        if (act === "right" && idx < S.jokers.length - 1) { var t2 = S.jokers[idx + 1]; S.jokers[idx + 1] = S.jokers[idx]; S.jokers[idx] = t2; renderJokers(); return; }
        selJoker = selJoker === id ? null : id; renderJokers();
      });
    });
  }
  var onShopChange = null;

  function cardHTML(c, cls, style) {
    var red = c.s === 1 || c.s === 3, face = c.r >= 11 && c.r <= 13;
    var deb = R && R.boss && R.boss.suitBan === c.s;
    return '<div class="pc' + (red ? " red" : "") + (face ? " face-card" : "") + (deb ? " debuff" : "") + (cls ? " " + cls : "") + '" data-id="' + c.id + '"' + (style ? ' style="' + style + '"' : "") +
      ' role="button" tabindex="0" aria-label="' + rl(c.r) + " of " + SUIT_NAMES[c.s] + '">' +
      '<div class="tl">' + rl(c.r) + "<i>" + SUITS[c.s] + '</i></div><div class="mid' + (face ? " face" : "") + '">' + (face ? FACE[c.r] : SUITS[c.s]) + '</div><div class="br">' + rl(c.r) + "<i>" + SUITS[c.s] + "</i></div></div>";
  }

  /* ================= blind select ================= */
  function showBlinds() {
    R = null; selJoker = null; onShopChange = null;
    updateRail(); renderJokers();
    $("#hand").innerHTML = ""; $("#actions").innerHTML = "";
    $("#htype").innerHTML = "&nbsp;"; $("#chips").textContent = 0; $("#mult").textContent = 0;
    var html = '<div class="panel"><p class="dim mono">ANTE ' + S.ante + (S.ante > 8 ? " · ENDLESS" : "") + '</p><h2>Choose your next blind</h2><div class="blinds">';
    for (var i = 0; i < 3; i++) {
      var b = blindInfo(i), cls = i === S.blind ? "now" : i < S.blind ? "done" : "";
      html += '<div class="bcard ' + cls + '"><div class="bchip" style="background:' + b.color + '33;border-color:' + b.color + '">' + b.a + "</div><b>" + esc(b.n) + '</b><small>Score at least</small><b class="t">' + fmt(b.target) + '</b><small>Reward ' + "$".repeat(b.reward) + "</small>" +
        '<div class="bd">' + esc(b.d || "") + "</div>" + (i === S.blind ? '<button class="btn gold" id="b-play" type="button">Play</button>' : i < S.blind ? '<span class="dim mono">Defeated</span>' : '<span class="dim mono">Upcoming</span>') + "</div>";
    }
    html += "</div></div>";
    $("#main").innerHTML = html;
    $("#b-play").addEventListener("click", function () { startRound(S.blind); });
  }

  /* ================= round ================= */
  function startRound(i) {
    var b = blindInfo(i);
    R = { blind: i, target: b.target, score: 0, hands: b.boss && b.boss.hands ? b.boss.hands : S.maxHands, discards: S.maxDiscards,
          deck: [], hand: [], sel: [], busy: false, boss: b.boss || null, sort: "rank", handSize: S.handSize + (b.boss && b.boss.size ? b.boss.size : 0) };
    for (var s = 0; s < 4; s++) for (var r = 2; r <= 14; r++) R.deck.push({ r: r, s: s, id: uid++ });
    Arcade.shuffle(R.deck);
    R.fullDeck = R.deck.slice();
    $("#main").innerHTML = '<div class="playarea" id="play"></div>';
    $("#actions").innerHTML = '<button class="btn blue" id="a-play" type="button">Play hand</button><button class="btn" id="a-rank" type="button">Sort rank</button><button class="btn" id="a-suit" type="button">Sort suit</button><button class="btn red" id="a-disc" type="button">Discard</button><span class="deckpill" id="deckn"></span>';
    $("#a-play").addEventListener("click", playHand);
    $("#a-disc").addEventListener("click", discard);
    $("#a-rank").addEventListener("click", function () { R.sort = "rank"; sortHand(); renderHand(); });
    $("#a-suit").addEventListener("click", function () { R.sort = "suit"; sortHand(); renderHand(); });
    updateRail();
    drawUp(true);
  }

  function sortHand() {
    R.hand.sort(R.sort === "rank" ? function (a, b) { return b.r - a.r || a.s - b.s; } : function (a, b) { return a.s - b.s || b.r - a.r; });
  }

  function drawUp(deal) {
    var before = R.hand.map(function (c) { return c.id; });
    while (R.hand.length < R.handSize && R.deck.length) R.hand.push(R.deck.pop());
    sortHand();
    renderHand(before);
  }

  function renderHand(oldIds) {
    var h = $("#hand"); if (!h || !R) return;
    var n = R.hand.length, mid = (n - 1) / 2;
    // --cw is a clamp(); resolve it the same way CSS does: clamp(56px, 8.4vw, 92px)
    var width = h.clientWidth || 600, cw = Math.min(92, Math.max(56, window.innerWidth * .084));
    var need = n * (cw + 6), ov = need > width ? (need - width) / (2 * n) + 3 : -3;
    var k = 0;
    h.innerHTML = R.hand.map(function (c, i) {
      var off = i - mid, isNew = oldIds && oldIds.indexOf(c.id) < 0;
      var st = "--r:" + (off * 2) + "deg;--y:" + (Math.abs(off) * Math.abs(off) * 1.2) + "px;--ov:" + ov + "px;--dl:" + ((isNew ? k++ : 0) * 60) + "ms";
      return cardHTML(c, (R.sel.indexOf(c) >= 0 ? "sel" : "") + (isNew ? " deal" : ""), st);
    }).join("");
    $$(".pc", h).forEach(function (el, i) {
      el.addEventListener("click", function () { toggle(R.hand[i]); });
      el.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(R.hand[i]); } });
    });
    $("#deckn").textContent = "Deck " + R.deck.length + "/52";
    updatePreview();
  }

  function toggle(c) {
    if (R.busy) return;
    var i = R.sel.indexOf(c);
    if (i >= 0) R.sel.splice(i, 1);
    else if (R.sel.length < 5) R.sel.push(c);
    renderHand();
  }

  function updatePreview() {
    var ok = R.sel.length > 0 && !R.busy;
    $("#a-play").disabled = !ok || R.hands <= 0 || (R.boss && R.boss.five && R.sel.length !== 5);
    $("#a-disc").disabled = !ok || R.discards <= 0;
    if (!R.sel.length) { $("#htype").innerHTML = "&nbsp;"; $("#chips").textContent = 0; $("#mult").textContent = 0; return; }
    var ev = evaluate(R.sel), lv = levelVals(ev.type);
    $("#htype").innerHTML = esc(HAND[ev.type].n) + ' <small>lvl ' + S.levels[ev.type] + "</small>";
    $("#chips").textContent = lv.c; $("#mult").textContent = lv.m;
  }

  function bump(el) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
  function pop(host, text, kind) {
    if (!host) return;
    var p = document.createElement("div"); p.className = "pop " + kind; p.textContent = text;
    host.appendChild(p); setTimeout(function () { p.remove(); }, 720 / speed + 50);
  }

  async function playHand() {
    if (R.busy || !R.sel.length || R.hands <= 0) return;
    if (R.boss && R.boss.five && R.sel.length !== 5) return;
    R.busy = true;
    var played = R.hand.filter(function (c) { return R.sel.indexOf(c) >= 0; });
    R.hand = R.hand.filter(function (c) { return R.sel.indexOf(c) < 0; });
    R.sel = []; R.hands--; S.handsPlayed++;
    updateRail(); renderHand();
    $("#a-play").disabled = true; $("#a-disc").disabled = true;
    var area = $("#play");
    area.innerHTML = played.map(function (c, i) { return cardHTML(c, "deal", "--dl:" + i * 60 + "ms"); }).join("");
    var ev = evaluate(played), lv = levelVals(ev.type);
    var ctx = { type: ev.type, has: ev.has, played: played, held: R.hand.length, chips: lv.c, mult: lv.m };
    var chipsEl = $("#chips"), multEl = $("#mult");
    $("#htype").innerHTML = esc(HAND[ev.type].n) + ' <small>lvl ' + S.levels[ev.type] + "</small>";
    chipsEl.textContent = ctx.chips; multEl.textContent = ctx.mult;
    await sleep(450);

    function apply(res, host) {
      if (!res) return false;
      if (res.chips) { ctx.chips += res.chips; chipsEl.textContent = fmt(ctx.chips); bump(chipsEl); pop(host, "+" + res.chips, "c"); }
      if (res.mult) { ctx.mult += res.mult; multEl.textContent = fmt(ctx.mult); bump(multEl); pop(host, "+" + res.mult + " Mult", "m"); }
      if (res.xmult && res.xmult !== 1) { ctx.mult *= res.xmult; multEl.textContent = fmt(ctx.mult); bump(multEl); pop(host, "×" + res.xmult + " Mult", "x"); }
      if (res.money) { S.money += res.money; updateRail(); pop(host, "+$" + res.money, "g"); }
      return true;
    }
    function jokerEl(j) { return $('#jrow .joker[data-id="' + j.id + '"]'); }
    function wiggle(el) { if (!el) return; el.classList.remove("wiggle"); void el.offsetWidth; el.classList.add("wiggle"); }

    // 1. each scoring card, left to right
    var playEls = $$(".pc", area);
    var echo = S.jokers.filter(function (j) { return JOKERS[j.k].retrigger; });
    for (var i = 0; i < ev.scoring.length; i++) {
      var c = ev.scoring[i], el = playEls[played.indexOf(c)];
      if (el) el.classList.add("scoring");
      if (R.boss && R.boss.suitBan === c.s) { await sleep(200); pop(el, "Debuffed", "m"); await sleep(250); continue; }
      var triggers = 1 + (i === 0 ? echo.reduce(function (a, j) { return a + JOKERS[j.k].retrigger; }, 0) : 0);
      for (var t = 0; t < triggers; t++) {
        if (t > 0) { pop(el, "Again!", "x"); echo.forEach(function (j) { wiggle(jokerEl(j)); }); await sleep(260); }
        await sleep(160);
        apply({ chips: chipsOf(c) }, el);
        await sleep(230);
        for (var k = 0; k < S.jokers.length; k++) {
          var j = S.jokers[k], d = JOKERS[j.k];
          if (!d.card) continue;
          var res = d.card(c, ctx, j);
          if (res) { var je = jokerEl(j); wiggle(je); apply(res, je); await sleep(260); }
        }
      }
    }
    // 2. jokers, left to right
    for (var m = 0; m < S.jokers.length; m++) {
      var jj = S.jokers[m], dd = JOKERS[jj.k];
      if (!dd.hand) continue;
      var r2 = dd.hand(ctx, jj);
      if (r2) { var je2 = jokerEl(jj); wiggle(je2); apply(r2, je2); if (dd.stack) renderJokers(); await sleep(320); }
    }
    // 3. total
    var total = Math.floor(ctx.chips * ctx.mult);
    S.best = Math.max(S.best, total);
    await sleep(250);
    var start = R.score, end = R.score + total, box = $("#rscorebox");
    var big = total >= R.target - R.score && total > 0;
    if (big || total >= R.target * .5) { $("#rscorebox").classList.add("hot"); document.querySelector(".table").classList.add("shake"); }
    var steps = 18;
    for (var s = 1; s <= steps; s++) { $("#rscore").textContent = fmt(start + (end - start) * s / steps); await sleep(22); }
    R.score = end;
    box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash");
    $("#htype").innerHTML = '<span style="color:#ffc53d">' + fmt(total) + "</span>";
    await sleep(500);
    $$(".pc", area).forEach(function (e) { e.classList.add("gone"); });
    await sleep(300);
    area.innerHTML = "";
    box.classList.remove("hot"); document.querySelector(".table").classList.remove("shake");
    chipsEl.textContent = 0; multEl.textContent = 0;

    if (R.score >= R.target) { R.busy = false; return winRound(); }
    if (R.hands <= 0) { R.busy = false; return gameOver(); }
    // The Hook: throw away random held cards
    if (R.boss && R.boss.hook) {
      for (var h = 0; h < R.boss.hook && R.hand.length; h++) R.hand.splice(rnd(R.hand.length), 1);
    }
    R.busy = false;
    drawUp(true);
    updateRail();
  }

  async function discard() {
    if (R.busy || !R.sel.length || R.discards <= 0) return;
    R.discards--;
    R.hand = R.hand.filter(function (c) { return R.sel.indexOf(c) < 0; });
    R.sel = [];
    updateRail();
    drawUp(true);
  }

  /* ================= after the round ================= */
  function winRound() {
    var b = blindInfo(R.blind), lines = [];
    lines.push(["Blind defeated", b.reward]);
    if (R.hands > 0) lines.push(["Remaining hands (" + R.hands + ")", R.hands]);
    var interest = Math.min(S.interestCap, Math.floor(S.money / 5));
    if (interest > 0) lines.push(["Interest ($1 per $5)", interest]);
    S.jokers.forEach(function (j) { var d = JOKERS[j.k]; if (d.cash) lines.push([d.n, d.cash()]); });
    var total = lines.reduce(function (a, l) { return a + l[1]; }, 0);
    var shattered = [];
    S.jokers = S.jokers.filter(function (j) { var d = JOKERS[j.k]; if (d.fragile && Math.random() < d.fragile) { shattered.push(d.n); return false; } return true; });
    var wasBoss = R.blind === 2;
    R = null;
    $("#htype").innerHTML = "&nbsp;";
    $("#hand").innerHTML = ""; $("#actions").innerHTML = "";
    renderJokers(); updateRail();
    $("#main").innerHTML = '<div class="panel"><p class="dim mono">ROUND WON</p><h2>Cash out</h2><div class="cash">' +
      lines.map(function (l) { return "<div><span>" + esc(l[0]) + "</span><b>+$" + l[1] + "</b></div>"; }).join("") +
      '<div class="total"><span>Total</span><b>+$' + total + "</b></div></div>" +
      (shattered.length ? '<p style="color:#ff8da0">🍷 ' + esc(shattered.join(", ")) + " shattered!</p>" : "") +
      '<button class="btn gold" id="b-cash" type="button">Cash out $' + total + "</button></div>";
    $("#b-cash").addEventListener("click", function () {
      S.money += total;
      if (wasBoss) {
        if (S.ante === 8 && !S.won) { S.won = true; Arcade.saveBest("luckyflush-ante", 8); return showWin(); }
        S.ante++; S.blind = 0; S.boss = rollBoss();
      } else S.blind++;
      Arcade.saveBest("luckyflush-ante", S.ante);
      Arcade.saveBest("luckyflush-hand", S.best);
      showShop();
    });
  }

  function rollJoker() {
    var owned = S.jokers.map(function (j) { return j.k; });
    var roll = Math.random(), r = roll < .07 ? 3 : roll < .35 ? 2 : 1;
    var pool = Object.keys(JOKERS).filter(function (k) { return JOKERS[k].r === r && owned.indexOf(k) < 0; });
    if (!pool.length) pool = Object.keys(JOKERS).filter(function (k) { return owned.indexOf(k) < 0; });
    return pick(pool);
  }

  function showShop() {
    updateRail(); renderJokers();
    var shop = { jokers: [], tomes: [], voucher: null };
    function stock() {
      shop.jokers = [];
      for (var i = 0; i < 2; i++) { var k = rollJoker(); if (k && shop.jokers.every(function (x) { return x.k !== k; })) shop.jokers.push({ k: k, id: uid++ }); }
    }
    stock();
    var hk = Arcade.shuffle(HANDS.map(function (h) { return h.k; }));
    shop.tomes = [{ k: hk[0] }, { k: hk[1] }];
    var vs = Object.keys(VOUCHERS).filter(function (k) { return S.vouchers.indexOf(k) < 0; });
    if (vs.length) shop.voucher = { k: pick(vs) };
    S.rerollCost = 5;

    function render() {
      updateRail();
      var full = S.jokers.length >= S.slots;
      var html = '<div class="panel shop"><p class="dim mono">SHOP · ANTE ' + S.ante + '</p><h2>Improve your run</h2><div class="shelf">';
      shop.jokers.forEach(function (j, i) {
        var d = JOKERS[j.k];
        html += '<div class="item' + (j.sold ? " sold" : "") + '">' + jokerHTML(j, { noTip: true }) + '<div class="nm">' + esc(d.n) + '</div><div class="desc">' + esc(d.x) + '</div><span class="price">$' + d.p + '</span><button class="btn green" data-buy="j' + i + '" type="button"' + (S.money < d.p || full ? " disabled" : "") + ">" + (full ? "Slots full" : "Buy") + "</button></div>";
      });
      shop.tomes.forEach(function (t, i) {
        var h = HAND[t.k];
        html += '<div class="item' + (t.sold ? " sold" : "") + '"><div class="tome">📖</div><div class="nm">Tome: ' + esc(h.n) + '</div><div class="desc">Level up ' + esc(h.n) + " (lvl " + S.levels[t.k] + " → " + (S.levels[t.k] + 1) + "): +" + h.lc + " Chips, +" + h.lm + ' Mult</div><span class="price">$3</span><button class="btn green" data-buy="t' + i + '" type="button"' + (S.money < 3 ? " disabled" : "") + ">Buy</button></div>";
      });
      if (shop.voucher) {
        var v = VOUCHERS[shop.voucher.k];
        html += '<div class="item' + (shop.voucher.sold ? " sold" : "") + '"><div class="tome voucher">' + v.a + '</div><div class="nm">' + esc(v.n) + '</div><div class="desc">' + esc(v.x) + ' (permanent)</div><span class="price">$10</span><button class="btn green" data-buy="v" type="button"' + (S.money < 10 ? " disabled" : "") + ">Buy</button></div>";
      }
      html += '</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" id="b-reroll" type="button"' + (S.money < S.rerollCost ? " disabled" : "") + ">Reroll jokers $" + S.rerollCost + '</button><button class="btn gold" id="b-next" type="button">Next round →</button></div>' +
        '<p class="dim" style="font-size:13px">Tip: click a Joker on the table to sell it or move it. Interest pays $1 per $5 you hold (max $' + S.interestCap + ").</p></div>";
      $("#main").innerHTML = html;
      $$("[data-buy]").forEach(function (b) {
        b.addEventListener("click", function () {
          var code = b.dataset.buy;
          if (code[0] === "j") { var j = shop.jokers[+code.slice(1)], d = JOKERS[j.k]; if (S.money < d.p || S.jokers.length >= S.slots) return; S.money -= d.p; j.sold = true; S.jokers.push({ k: j.k, id: uid++ }); renderJokers(); }
          else if (code[0] === "t") { var t = shop.tomes[+code.slice(1)]; if (S.money < 3) return; S.money -= 3; t.sold = true; S.levels[t.k]++; }
          else if (code === "v") { if (S.money < 10) return; S.money -= 10; shop.voucher.sold = true; S.vouchers.push(shop.voucher.k); VOUCHERS[shop.voucher.k].f(); renderJokers(); }
          render();
        });
      });
      $("#b-reroll").addEventListener("click", function () { if (S.money < S.rerollCost) return; S.money -= S.rerollCost; S.rerollCost++; stock(); render(); });
      $("#b-next").addEventListener("click", showBlinds);
    }
    onShopChange = render;
    render();
  }

  function gameOver() {
    Arcade.saveBest("luckyflush-ante", S.ante);
    Arcade.saveBest("luckyflush-hand", S.best);
    var target = R.target, score = R.score;
    R = null;
    $("#hand").innerHTML = ""; $("#actions").innerHTML = "";
    updateRail();
    $("#main").innerHTML = '<div class="panel"><div style="font-size:72px">🂠</div><p class="dim mono">GAME OVER</p><h2>The house wins this time</h2>' +
      '<p class="dim">Scored ' + fmt(score) + " of " + fmt(target) + " needed.</p>" +
      '<div class="feat" style="max-width:560px"><div><b>Ante ' + S.ante + "</b>Reached</div><div><b>" + fmt(S.best) + "</b>Best single hand</div><div><b>" + S.handsPlayed + "</b>Hands played</div></div>" +
      '<p class="dim mono">Best ante ' + Arcade.best("luckyflush-ante") + " · best hand " + fmt(Arcade.best("luckyflush-hand")) + "</p>" +
      '<div style="display:flex;gap:10px"><button class="btn gold" id="b-again" type="button">New run</button><button class="btn" id="b-title" type="button">Title</button></div></div>';
    $("#b-again").addEventListener("click", newRun);
    $("#b-title").addEventListener("click", showTitle);
  }

  function showWin() {
    $("#main").innerHTML = '<div class="panel"><div style="font-size:80px">🏆</div><p class="dim mono">ANTE 8 CLEARED</p><h2>You broke the bank!</h2>' +
      '<p class="dim">Best hand: ' + fmt(S.best) + ". Keep going in endless mode, where blinds grow even faster.</p>" +
      '<div style="display:flex;gap:10px"><button class="btn gold" id="b-endless" type="button">Endless mode</button><button class="btn" id="b-again" type="button">New run</button></div></div>';
    $("#b-endless").addEventListener("click", function () { S.ante++; S.blind = 0; S.boss = rollBoss(); showShop(); });
    $("#b-again").addEventListener("click", newRun);
  }

  /* ================= modals ================= */
  function openModal(html) {
    modal.innerHTML = '<div class="box">' + html + "</div>"; modal.hidden = false;
    var c = $("#m-close", modal); if (c) c.addEventListener("click", closeModal);
  }
  function closeModal() { modal.hidden = true; modal.innerHTML = ""; }
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !modal.hidden) closeModal(); });

  function showLevels() {
    openModal('<div style="display:flex;justify-content:space-between;align-items:center"><h2>Hand levels</h2><button class="btn" id="m-close" type="button">Close</button></div><div class="levels">' +
      HANDS.slice().reverse().map(function (h) { var v = levelVals(h.k); return '<div><span class="lv">lvl ' + S.levels[h.k] + "</span><span>" + esc(h.n) + '</span><span class="cmv mono"><span>' + v.c + "</span> × <span>" + v.m + "</span></span></div>"; }).join("") + "</div>");
  }
  function showDeck() {
    var all = [], inDeck = {};
    if (R) R.deck.forEach(function (c) { inDeck[c.r + ":" + c.s] = true; });
    var rows = SUITS.map(function (s, si) {
      var cs = [];
      for (var r = 14; r >= 2; r--) cs.push(cardHTML({ r: r, s: si, id: 0 }, R && !inDeck[r + ":" + si] ? "used" : ""));
      return '<div class="row">' + cs.join("") + "</div>";
    }).join("");
    openModal('<div style="display:flex;justify-content:space-between;align-items:center"><h2>' + (R ? "Remaining deck " + R.deck.length + "/52" : "Your deck (52 cards)") + '</h2><button class="btn" id="m-close" type="button">Close</button></div><div class="deckgrid">' + rows + "</div>" + (R ? '<p class="dim">Faded cards have already been drawn this round.</p>' : ""));
  }
  $("#b-notes").addEventListener("click", function () {
    openModal('<div style="display:flex;justify-content:space-between;align-items:center"><h2>How it\'s built</h2><button class="btn" id="m-close" type="button">Close</button></div><div class="box notes"><ul>' +
      "<li><b>Hand evaluator.</b> Cards are grouped by rank and sorted by group size; flush and straight (including A-2-3-4-5) are checked separately. The result names the hand <i>and</i> which cards score, so kickers don't add chips.</li>" +
      "<li><b>Scoring pipeline.</b> <code>score = (base chips + card chips + joker chips) × (base mult + joker mult) × joker ×mult</code>. Adding is applied before multiplying, so joker <i>order</i> is a real decision.</li>" +
      "<li><b>Hook-based jokers.</b> Each joker is data plus optional hooks: <code>card()</code> per scored card, <code>hand()</code> once per hand, <code>cash()</code> at round end. The engine knows nothing about specific jokers.</li>" +
      "<li><b>Async score animation.</b> The scoring loop <code>await</code>s short beats between each step, so the maths and the presentation are the same code path. The speed toggle just scales the delays.</li>" +
      "<li><b>Economy.</b> Interest ($1 per $5, capped) rewards saving; rerolls get more expensive; vouchers are permanent upgrades. Spending vs saving is the core tension.</li>" +
      "<li><b>Boss blinds</b> are modifiers (debuffed suit, halved base, forced 5 cards, fewer hands) that force you to adapt the build.</li></ul></div>");
  });
  $("#b-speed").addEventListener("click", function () {
    speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
    this.textContent = "Speed " + speed + "×";
    try { localStorage.setItem("luckyflush-speed", speed); } catch (e) {}
  });
  try { var sp = Number(localStorage.getItem("luckyflush-speed")); if (sp === 2 || sp === 4) { speed = sp; $("#b-speed").textContent = "Speed " + sp + "×"; } } catch (e) {}

  document.addEventListener("keydown", function (e) {
    if (!R || !modal.hidden || R.busy) return;
    if (e.key === "Enter") { e.preventDefault(); playHand(); }
    else if (e.key === "d" || e.key === "D") discard();
    else if (/^[1-9]$/.test(e.key) && R.hand[+e.key - 1]) toggle(R.hand[+e.key - 1]);
  });
  window.addEventListener("resize", function () { if (R && !R.busy) renderHand(); });

  /* ================= title ================= */
  function showTitle() {
    S = null; R = null;
    var demo = [{ r: 14, s: 0 }, { r: 13, s: 1 }, { r: 12, s: 3 }, { r: 11, s: 2 }, { r: 10, s: 1 }];
    var bestA = Arcade.best("luckyflush-ante"), bestH = Arcade.best("luckyflush-hand");
    root.innerHTML = '<div class="title"><div class="fan">' + demo.map(function (c, i) { return cardHTML(c, "", "transform:rotate(" + ((i - 2) * 10) + "deg) translateY(" + Math.abs(i - 2) * 8 + "px);animation-delay:" + i * 80 + "ms"); }).join("") + "</div>" +
      "<h1>LUCKY<br>FLUSH</h1><p class=\"dim\" style=\"font-size:18px;max-width:46ch\">A poker roguelite. Play hands to score <b style=\"color:var(--chips)\">Chips</b> × <b style=\"color:var(--mult)\">Mult</b>, collect jokers that bend the rules, and beat eight antes of ever-bigger blinds.</p>" +
      '<button class="btn gold" id="b-start" type="button" style="font-size:19px;padding:14px 30px">▶ Start run</button>' +
      (bestA ? '<p class="mono dim">Best ante ' + bestA + " · best hand " + fmt(bestH) + "</p>" : "") +
      '<div class="feat"><div><b>🃏 25 jokers</b>Each one changes how you score. Find combos.</div><div><b>📖 Level up hands</b>Tomes make your favourite hand stronger.</div><div><b>👹 7 boss blinds</b>Debuffs that break lazy builds.</div><div><b>♾️ Endless</b>After ante 8, how far can you go?</div></div>' +
      '<p class="dim" style="font-size:13px">Click cards to select up to 5 · <span class="mono">Enter</span> play · <span class="mono">D</span> discard · <span class="mono">1–9</span> pick cards</p></div>';
    $("#b-start").addEventListener("click", newRun);
  }
  showTitle();
})();
</script>
