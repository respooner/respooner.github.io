<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bug Slayer · Mini Arcade</title>
<meta name="description" content="A roguelike deckbuilder for developers: fight bugs with code cards, climb a branching map, collect relics.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23150f2e'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle'%3E%F0%9F%90%9B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="games.js"></script>
<style>
/* Bug Slayer: always-dark game surface. Layout: top HUD bar, one swappable screen
   (title / map / combat / reward / shop / rest / event / end) and a modal layer. */
:root {
  --bg: #0b0a1a; --bg2: #151233; --panel: rgb(255 255 255 / .06); --panel-2: rgb(255 255 255 / .1);
  --line: rgb(255 255 255 / .12); --text: #eeeaff; --dim: #a59fc9;
  --atk: #ff5d73; --skl: #36c9f0; --pow: #b085ff; --sts: #7d7a92;
  --gold: #ffcb52; --hp: #ff4f6d; --block: #5cb8ff; --good: #5ff0a5; --energy: #ffd166;
  --display: "Bricolage Grotesque", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  --cw: clamp(86px, 15vw, 128px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; overflow-x: clip; }
body { background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60% 50% at 15% 10%, rgb(124 77 255 / .28), transparent 70%),
    radial-gradient(50% 45% at 90% 20%, rgb(0 200 255 / .16), transparent 70%),
    radial-gradient(70% 50% at 50% 110%, rgb(255 60 120 / .18), transparent 70%),
    linear-gradient(var(--bg), var(--bg2)); }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .35;
  background-image: linear-gradient(rgb(255 255 255 / .04) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .04) 1px, transparent 1px);
  background-size: 40px 40px; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%); }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.05; }
p { margin: 0; }
a { color: inherit; }
b.k { color: var(--gold); font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); font-weight: 600; transition: transform .15s, background .15s, border-color .15s, box-shadow .15s; text-decoration: none; }
.btn:hover { background: var(--panel-2); border-color: rgb(255 255 255 / .3); transform: translateY(-1px); }
.btn.hot { background: linear-gradient(135deg, #8b5cff, #ff4f9a); border-color: transparent; box-shadow: 0 8px 24px -8px #ff4f9a; }
.btn.hot:hover { box-shadow: 0 10px 30px -6px #ff4f9a; }
.btn[disabled] { opacity: .4; pointer-events: none; }

/* ---------- HUD ---------- */
.hud { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 8px max(12px, env(safe-area-inset-left)); flex-wrap: wrap;
  background: rgb(11 10 26 / .72); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.hud .back { white-space: nowrap; font: 500 13px var(--mono); color: var(--dim); text-decoration: none; padding: 6px 8px; border-radius: 8px; }
.hud .back:hover { color: var(--text); background: var(--panel); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font: 600 14px var(--mono); white-space: nowrap; }
.pill.hp { color: #ffd0d8; } .pill.gold { color: var(--gold); }
.relics { display: flex; gap: 4px; flex-wrap: wrap; }
.relic { width: 32px; height: 32px; display: grid; place-items: center; font-size: 18px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); position: relative; }
.relic:hover::after, .relic:focus::after { content: attr(data-tip); position: absolute; top: 38px; left: 0; width: 220px; padding: 8px 10px; border-radius: 10px; background: #1f1a42; border: 1px solid var(--line); font: 400 13px/1.4 var(--body); z-index: 50; white-space: normal; }
.relic.flash { animation: flash .6s; }
@keyframes flash { 40% { transform: scale(1.3); box-shadow: 0 0 18px var(--gold); } }
.hud .sp { flex: 1; }

/* ---------- screens ---------- */
#screen { min-height: calc(100vh - 52px); min-height: calc(100dvh - 52px); }
.center { display: grid; place-items: center; text-align: center; padding: 40px 16px; gap: 18px; }
.title-wrap { display: grid; gap: 20px; justify-items: center; max-width: 760px; margin: 0 auto; padding: 8vh 16px 40px; text-align: center; }
.logo { font: 800 clamp(54px, 11vw, 112px)/.9 var(--display); letter-spacing: -.04em;
  background: linear-gradient(120deg, #fff 10%, #b98cff 45%, #ff5d9e 75%, #ffcb52); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 8px 30px rgb(176 133 255 / .45)); }
.tagline { color: var(--dim); font-size: 18px; max-width: 46ch; }
.floaty { font-size: 64px; display: flex; gap: 18px; }
.floaty span { animation: bob 3s ease-in-out infinite; display: inline-block; }
.floaty span:nth-child(2) { animation-delay: -1s; } .floaty span:nth-child(3) { animation-delay: -2s; }
@keyframes bob { 50% { transform: translateY(-10px) rotate(-4deg); } }
.feature-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; width: 100%; }
.feature { padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); text-align: left; font-size: 13px; color: var(--dim); }
.feature b { display: block; color: var(--text); font-size: 15px; margin-bottom: 2px; }
.mono { font-family: var(--mono); }
.dim { color: var(--dim); }

/* ---------- map ---------- */
.map-wrap { max-width: 640px; margin: 0 auto; padding: 18px 12px 60px; }
.map-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 10px; }
.map-head h2 { font-size: 30px; }
.map-svg { width: 100%; height: auto; display: block; }
.map-svg .edge { stroke: rgb(255 255 255 / .16); stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; fill: none; }
.map-svg .edge.done { stroke: #b085ff; stroke-dasharray: none; opacity: .8; }
.map-svg .node circle { fill: #1c1840; stroke: rgb(255 255 255 / .2); stroke-width: 2; transition: r .2s; }
.map-svg .node text { font-size: 20px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.map-svg .node.done circle { fill: #3a2a74; stroke: #b085ff; }
.map-svg .node.done text, .map-svg .node.locked text { opacity: .45; }
.map-svg .node.open { cursor: pointer; }
.map-svg .node.open circle { stroke: #ffcb52; stroke-width: 3; animation: ring 1.4s ease-in-out infinite; }
.map-svg .node.open:hover circle { fill: #3b2f7a; }
.map-svg .node.here circle { stroke: #5ff0a5; stroke-width: 3; }
@keyframes ring { 50% { stroke-opacity: .35; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--dim); }

/* ---------- combat ---------- */
.combat { display: grid; grid-template-rows: 1fr auto; min-height: inherit; }
.arena { align-self: center; display: grid; grid-template-columns: minmax(130px, 1fr) 3fr; align-items: center; gap: 12px; padding: 18px 16px 6px; max-width: 1100px; width: 100%; margin: 0 auto; }
.foes { display: flex; justify-content: center; align-items: end; gap: clamp(8px, 3vw, 40px); flex-wrap: wrap; }
.unit { position: relative; display: grid; justify-items: center; gap: 6px; padding: 10px; border-radius: 18px; transition: transform .2s, opacity .4s, filter .4s; min-width: 110px; }
.unit .avatar { font-size: clamp(56px, 9vw, 92px); line-height: 1; filter: drop-shadow(0 12px 18px rgb(0 0 0 / .5)); animation: idle 3.2s ease-in-out infinite; user-select: none; }
.unit.boss .avatar { font-size: clamp(84px, 13vw, 132px); }
.unit .shadow { width: 70%; height: 10px; border-radius: 50%; background: rgb(0 0 0 / .45); filter: blur(4px); margin-top: -4px; }
@keyframes idle { 50% { transform: translateY(-6px); } }
.unit .uname { font: 700 15px var(--display); }
.bar { position: relative; width: 120px; height: 14px; border-radius: 99px; background: rgb(0 0 0 / .45); border: 1px solid var(--line); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ff3d6a, #ff7a8f); transition: width .35s; }
.bar u { position: absolute; inset: 0 auto 0 0; background: rgb(255 255 255 / .35); transition: width .9s .25s; text-decoration: none; }
.bar.blocked { border-color: var(--block); box-shadow: 0 0 10px rgb(92 184 255 / .5); }
.bar span { position: relative; display: block; text-align: center; font: 600 11px/13px var(--mono); text-shadow: 0 1px 2px #000; }
.blk { position: absolute; left: -16px; top: 50%; transform: translateY(-50%); width: 26px; height: 28px; display: grid; place-items: center; font: 700 12px var(--mono);
  background: linear-gradient(#5cb8ff, #2f6fe0); clip-path: polygon(50% 0, 100% 18%, 100% 60%, 50% 100%, 0 60%, 0 18%); color: #fff; z-index: 1; }
.barrow { position: relative; }
.statuses { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; min-height: 22px; }
.st { font: 600 11px var(--mono); padding: 2px 6px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); cursor: help; }
.st.bad { color: #ffb3c0; } .st.goodst { color: #b5ffd9; }
.intent { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; background: rgb(0 0 0 / .4); border: 1px solid var(--line); font: 700 14px var(--mono); min-height: 30px; cursor: help; }
.intent .a { color: #ff8a9b; } .intent .d { color: #9fd3ff; } .intent .u { color: #ffd98a; } .intent .x { color: #d8b4ff; }
.intent.charge { animation: warn .8s ease-in-out infinite; border-color: var(--atk); }
@keyframes warn { 50% { box-shadow: 0 0 16px var(--atk); } }
.foe.targetable { cursor: crosshair; }
.foe.targetable:hover, .foe.targetable.aim { background: rgb(255 93 115 / .12); outline: 2px dashed var(--atk); }
.foe.dead { opacity: 0; transform: scale(.6) translateY(20px); filter: blur(4px) grayscale(1); pointer-events: none; }
.hurt { animation: hurt .35s; }
@keyframes hurt { 20% { transform: translateX(-8px) rotate(-3deg); filter: brightness(2) saturate(0); } 60% { transform: translateX(6px); } }
.lunge { animation: lunge .35s; }
@keyframes lunge { 40% { transform: translateY(18px) scale(1.08); } }
.player-lunge { animation: plunge .3s; }
@keyframes plunge { 40% { transform: translateX(24px) scale(1.06); } }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
.redflash { animation: redflash .45s; }
@keyframes redflash { 0% { box-shadow: inset 0 0 0 0 rgb(255 40 80 / 0); } 30% { box-shadow: inset 0 0 120px 20px rgb(255 40 80 / .45); } }

.dock { position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 10px; padding: 0 14px max(12px, env(safe-area-inset-bottom)); max-width: 1200px; width: 100%; margin: 0 auto; }
.energy { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font: 800 26px var(--display); color: #2a1a00;
  background: radial-gradient(circle at 35% 30%, #fff6c9, #ffd166 45%, #f29f05); box-shadow: 0 0 30px rgb(255 209 102 / .55), inset 0 -6px 10px rgb(0 0 0 / .2); margin-bottom: 20px; }
.energy.empty { filter: grayscale(.8) brightness(.6); box-shadow: none; }
.pile { display: grid; justify-items: center; gap: 2px; font: 600 12px var(--mono); color: var(--dim); background: none; border: 0; padding: 4px; }
.pile .stack { width: 44px; height: 60px; border-radius: 8px; display: grid; place-items: center; font: 700 16px var(--mono); color: var(--text);
  background: linear-gradient(135deg, #3b2f7a, #1b1640); border: 1px solid var(--line); box-shadow: 3px 3px 0 #1b1640, 6px 6px 0 rgb(255 255 255 / .05); }
.leftdock, .rightdock { display: grid; gap: 8px; justify-items: center; }
.end-turn { min-width: 112px; padding: 14px 18px; }
.hand { position: relative; height: calc(var(--cw) * 1.45 + 30px); display: flex; justify-content: center; align-items: flex-end; }
.hand .card { margin: 0 calc(var(--ov, 0px) * -1); transform-origin: 50% 120%; transform: rotate(var(--r)) translateY(var(--y)); z-index: var(--z); }
.hand .card:hover, .hand .card.sel { transform: translateY(-34px) scale(1.12); z-index: 40; }
.hand .card.sel { box-shadow: 0 0 0 3px var(--gold), 0 20px 40px -10px rgb(0 0 0 / .8); }
.hand .card.cant { filter: saturate(.4) brightness(.75); }
.hand .card.enter { animation: deal .35s backwards; animation-delay: var(--dl); }
@keyframes deal { from { opacity: 0; transform: translate(-80px, 40px) rotate(-24deg) scale(.6); } }
.combat-msg { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); font: 600 13px var(--mono); color: var(--gold); pointer-events: none; white-space: nowrap; }

/* ---------- cards ---------- */
.card { --c: var(--atk); position: relative; width: var(--cw); height: calc(var(--cw) * 1.42); flex: none; border-radius: calc(var(--cw) * .1);
  background: linear-gradient(165deg, color-mix(in srgb, var(--c) 30%, #1b1738) 0%, #16132e 55%);
  border: 2px solid color-mix(in srgb, var(--c) 55%, #000); box-shadow: 0 14px 30px -12px rgb(0 0 0 / .8);
  display: grid; grid-template-rows: auto auto auto 1fr; padding: calc(var(--cw) * .06); gap: 2px; cursor: pointer; user-select: none;
  transition: transform .18s cubic-bezier(.2,.8,.3,1.2), box-shadow .18s, filter .2s; text-align: center; overflow: hidden; }
.card.skl { --c: var(--skl); } .card.pow { --c: var(--pow); } .card.sts { --c: var(--sts); }
.card.r2 { border-color: #4fa3ff; } .card.r3 { border-color: var(--gold); }
.card.r3::after { content: ""; position: absolute; inset: -50%; background: linear-gradient(115deg, transparent 40%, rgb(255 230 160 / .25) 50%, transparent 60%); animation: shine 3.5s infinite; pointer-events: none; }
@keyframes shine { from { transform: translateX(-60%); } to { transform: translateX(60%); } }
.card .cost { position: absolute; left: 4px; top: 4px; width: calc(var(--cw) * .25); height: calc(var(--cw) * .25); border-radius: 50%; display: grid; place-items: center; z-index: 2;
  font: 800 calc(var(--cw) * .15) var(--display); color: #2a1a00; background: radial-gradient(circle at 35% 30%, #fff6c9, #ffd166 50%, #e08a00); box-shadow: 0 2px 6px rgb(0 0 0 / .5); }
.card .cost.down { color: #0b5a2c; background: radial-gradient(circle at 35% 30%, #e6fff1, #5ff0a5 50%, #12a35a); }
.card .art { height: calc(var(--cw) * .5); border-radius: calc(var(--cw) * .07); display: grid; place-items: center; font-size: calc(var(--cw) * .3);
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 45%, transparent), transparent 70%), rgb(0 0 0 / .3); border: 1px solid rgb(255 255 255 / .08); }
.card .cname { font: 700 calc(var(--cw) * .105)/1.1 var(--display); padding-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.up .cname { color: var(--good); }
.card .ctype { font: 500 calc(var(--cw) * .07) var(--mono); text-transform: uppercase; letter-spacing: .08em; color: color-mix(in srgb, var(--c) 70%, #fff); }
.card .desc { font-size: calc(var(--cw) * .088); line-height: 1.3; color: #ddd8f5; display: grid; place-items: center; padding: 0 2px; }
.card .desc .plus { color: var(--good); font-weight: 700; } .card .desc .minus { color: #ff8a9b; font-weight: 700; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cw), 1fr)); gap: 14px; justify-items: center; }
.card-grid .card:hover { transform: translateY(-6px) scale(1.04); }
.big-cards { --cw: clamp(120px, 26vw, 170px); display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.big-cards .card:hover { transform: translateY(-10px) rotate(-1.5deg) scale(1.04); box-shadow: 0 0 0 3px var(--gold), 0 24px 40px -12px #000; }
.ghost { position: fixed; z-index: 60; pointer-events: none; transition: transform .32s cubic-bezier(.5,0,.7,.4), opacity .32s; }

/* ---------- floating numbers / fx ---------- */
.float { position: fixed; z-index: 70; pointer-events: none; font: 800 30px var(--display); color: #fff; text-shadow: 0 3px 0 #000, 0 0 14px rgb(255 60 100 / .8);
  animation: floatUp .9s ease-out forwards; }
.float.blockf { color: #bfe3ff; text-shadow: 0 3px 0 #000, 0 0 14px rgb(92 184 255 / .9); font-size: 24px; }
.float.healf { color: #b5ffd9; text-shadow: 0 3px 0 #000, 0 0 14px rgb(95 240 165 / .8); }
.float.info { font-size: 18px; color: var(--gold); text-shadow: 0 2px 0 #000; }
@keyframes floatUp { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 15% { transform: translate(-50%, -16px) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -70px) scale(1); opacity: 0; } }
.spark { position: fixed; z-index: 69; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; animation: spark .6s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
.banner { position: fixed; left: 0; right: 0; top: 40%; z-index: 65; text-align: center; pointer-events: none; font: 800 clamp(34px, 7vw, 64px) var(--display);
  text-shadow: 0 6px 30px rgb(0 0 0 / .8); animation: bannerIn 1.1s ease-out forwards; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(1.4); letter-spacing: .2em; } 20% { opacity: 1; transform: scale(1); letter-spacing: 0; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }

/* ---------- panels: reward / shop / rest / event ---------- */
.panel-wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 60px; display: grid; gap: 22px; justify-items: center; text-align: center; }
.panel-wrap h2 { font-size: clamp(30px, 5vw, 44px); }
.loot { display: grid; gap: 10px; width: min(100%, 420px); }
.loot button { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); text-align: left; transition: background .15s, transform .15s; }
.loot button:hover { background: var(--panel-2); transform: translateX(4px); }
.loot .ico { font-size: 26px; width: 36px; text-align: center; }
.shop-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
.shop-item { display: grid; gap: 6px; justify-items: center; }
.price { font: 700 14px var(--mono); color: var(--gold); padding: 3px 10px; border-radius: 99px; background: rgb(0 0 0 / .35); }
.price.no { color: #ff8a9b; }
.sold { opacity: .25; pointer-events: none; }
.relic-card { width: 170px; padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 6px; justify-items: center; cursor: pointer; transition: transform .15s, border-color .15s; }
.relic-card:hover { transform: translateY(-4px); border-color: var(--gold); }
.relic-card .ri { font-size: 40px; }
.relic-card b { font-family: var(--display); font-size: 16px; }
.relic-card p { font-size: 13px; color: var(--dim); }
.choices { display: grid; gap: 10px; width: min(100%, 520px); }
.choice { display: grid; gap: 2px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); text-align: left; transition: background .15s, border-color .15s; }
.choice:hover { background: var(--panel-2); border-color: var(--gold); }
.choice small { color: var(--dim); font-size: 13px; }
.event-art { font-size: 84px; filter: drop-shadow(0 10px 30px rgb(176 133 255 / .5)); }
.story { max-width: 56ch; color: #d6d1f3; font-size: 17px; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 80; background: rgb(5 4 14 / .82); backdrop-filter: blur(6px); display: grid; place-items: start center; overflow-y: auto; padding: 40px 16px; }
.modal-box { width: min(100%, 980px); display: grid; gap: 18px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal-head h2 { font-size: 28px; }
.notes { text-align: left; display: grid; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.notes li { margin-bottom: 6px; color: #d6d1f3; }
.notes code { font: 500 .9em var(--mono); background: rgb(255 255 255 / .08); padding: 1px 5px; border-radius: 5px; }

@media (max-width: 700px) {
  .hud { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 6px; padding: 6px 10px; }
  .hud .sp { display: none; }
  .hud .back { padding: 6px 4px; }
  .pill { font-size: 12px; padding: 4px 8px; }
  .relics { flex-wrap: nowrap; }
  .relic { width: 28px; height: 28px; font-size: 15px; flex: none; }
  .hud .btn { padding: 6px 10px; font-size: 13px; flex: none; }
  .arena { grid-template-columns: 1fr; }

                p: async function (v, t) { var n = C.hand.length; for (var i = 0; i < n; i++) { await hit(t, v.d); await sleep(70); } } },
    spaghetti: { n: "Spaghetti Code", t: "sts", c: -1, r: -1, a: "🍝", eth: 1, b: {}, u: {}, x: "Unplayable. <b class=k>Ethereal</b>: vanishes at end of turn." },

  var TYPE_LABEL = { atk: "Attack", skl: "Skill", pow: "Power", sts: "Status" };
  var POOL = Object.keys(CARDS).filter(function (k) { return CARDS[k].r >= 1; });

  /* ================= DATA: enemies ================= */

    nullptr:  { n: "Null Pointer", a: "👾", hp: [18, 23], ai: function (e) { return e.turn % 2 === 0 ? { atk: 7 } : { atk: 4, weak: 1 }; } },
    race:     { n: "Race Condition", a: "🐛", hp: [21, 25], ai: function () { return Math.random() < .6 ? { atk: 3, times: 2 } : { atk: 5, block: 6 }; } },
    trojan:   { n: "Trojan Horse", a: "🐴", hp: [25, 29], ai: function (e) { return e.turn % 3 === 2 ? { atk: 3, exposed: 2 } : { atk: 9 }; } },
    memleak:  { n: "Memory Leak", a: "🦠", hp: [30, 34], leak: 2, ai: function () { return { atk: 5 }; } },

  };

    keyboard:  { n: "Clacky Keyboard", a: "⌨️", x: "Your first Attack each turn deals 4 extra damage." },

    mug:       { n: "Coffee Mug", a: "☕", x: "Gain 1 extra Energy on the first turn of each combat." },

  /* ================= cards: values & rendering ================= */
  function vals(card) { var d = CARDS[card.k], v = Object.assign({}, d.b, card.up ? d.u : {}); return v; }

    var d = CARDS[card.k], v = vals(card);

  }

    var pool = Object.keys(RELICS).filter(function (k) { return !!RELICS[k].boss === !!boss && !has(k); });

  /* ================= map generation ================= */

  var LABEL = { fight: "Bug fight", elite: "Elite bug", rest: "Coffee break", shop: "Package store", event: "Unknown", treasure: "Treasure", boss: "Boss" };

  // Random walks from the bottom row upwards; a step is rejected if it would cross an
  // edge that another path already drew between the same two rows, so lines never cross.
  function genMap() {
    var nodes = {}, edges = [];
    function key(r, c) { return r + ":" + c; }
    function crosses(r, a, b) {
      return edges.some(function (e) { return e.r === r && ((e.a < a && e.b > b) || (e.a > a && e.b < b)); });
    }
    var cols = Arcade.shuffle([0, 1, 2, 3, 4]);
    var starts = [cols[0], cols[1], cols[2], rnd(COLS)];
    for (var p = 0; p < starts.length; p++) {
      var c = starts[p];
      nodes[key(0, c)] = { r: 0, c: c };
      for (var r = 0; r < ROWS - 2; r++) {
        var opts = [c - 1, c, c + 1].filter(function (n) { return n >= 0 && n < COLS && !crosses(r, c, n); });
        var n = opts.length ? pick(opts) : c;
        if (!edges.some(function (e) { return e.r === r && e.a === c && e.b === n; })) edges.push({ r: r, a: c, b: n });
        nodes[key(r + 1, n)] = { r: r + 1, c: n };
        c = n;
      }
    }
    // boss row
    var bossC = 2;
    nodes[key(ROWS - 1, bossC)] = { r: ROWS - 1, c: bossC };
    Object.keys(nodes).forEach(function (k) { var nd = nodes[k]; if (nd.r === ROWS - 2) edges.push({ r: ROWS - 2, a: nd.c, b: bossC }); });
    // assign room types
    Object.keys(nodes).forEach(function (k) {
      var nd = nodes[k], r = nd.r, t;
      if (r === 0) t = "fight";
      else if (r === ROWS - 1) t = "boss";
      else if (r === ROWS - 2) t = "rest";
      else if (r === 6) t = "treasure";
      else {
        var x = Math.random();
        t = x < .44 ? "fight" : x < .66 ? "event" : x < .78 && r >= 4 ? "elite" : x < .89 && r >= 3 ? "rest" : x < 1 && r >= 2 ? "shop" : "fight";
      }
      nd.t = t; nd.id = k;
    });
    return { nodes: nodes, edges: edges, done: [] };
  }

  function nextNodes() {
    var m = G.map;
    if (!G.pos) return Object.keys(m.nodes).filter(function (k) { return m.nodes[k].r === 0; });
    var cur = m.nodes[G.pos];
    return m.edges.filter(function (e) { return e.r === cur.r && e.a === cur.c; }).map(function (e) { return (cur.r + 1) + ":" + e.b; });
  }

    C = null; hud();

      var x = nd.t === "boss" ? W / 2 : 60 + nd.c * ((W - 120) / (COLS - 1)) + jx;

    Object.keys(m.nodes).forEach(function (k) {

    var loot = [{ ico: "◉", label: gold + " gold", fn: function () { G.gold += gold; } },
                { ico: "🃏", label: "Add a card to your deck", card: true }];
    if (kind === "elite") { var r = rollRelic(false); if (r) loot.push({ ico: RELICS[r].a, label: RELICS[r].n, sub: RELICS[r].x, fn: function () { addRelic(r); } }); }
    C = null;
    if (kind === "boss") return bossReward(gold);
    showLoot("Bugs squashed!", loot, kind === "elite" ? 12 : 0);
  }

  function showLoot(title, loot, rareBoost) {
    hud();
    screen.innerHTML = '<div class="panel-wrap"><p class="dim mono">REWARDS</p><h2>' + title + '</h2><div class="loot" id="loot"></div><button class="btn hot" id="go-on" type="button">Continue to map →</button></div>';
    var box = $("#loot");
    loot.forEach(function (l) {
      var b = document.createElement("button"); b.type = "button";
      b.innerHTML = '<span class="ico">' + l.ico + "</span><span><b>" + esc(l.label) + "</b>" + (l.sub ? '<br><small class="dim">' + esc(l.sub) + "</small>" : "") + "</span>";
      b.addEventListener("click", function () {
        if (l.card) { cardChoice(rollCards(3, rareBoost), function () { b.remove(); }); return; }
        l.fn(); b.remove(); hud();
      });
      box.appendChild(b);
    });
    $("#go-on").addEventListener("click", showMap);
  }

  function cardChoice(keys, after) {
    var cards = keys.map(function (k) { return mk(k); });
    modal.dataset.dismiss = "";
    modal.innerHTML = '<div class="modal-box"><div class="modal-head"><h2>Choose a card</h2><button class="btn" id="skip" type="button">Skip</button></div><div class="big-cards">' +
      cards.map(function (c) { return cardHTML(c); }).join("") + "</div></div>";
    modal.hidden = false;
    $$(".big-cards .card", modal).forEach(function (el, i) {
      el.addEventListener("click", function () { G.deck.push(cards[i]); closeModal(); hud(); toastBanner("+ " + CARDS[cards[i].k].n, "#5ff0a5"); if (after) after(); });
    });
    $("#skip").addEventListener("click", function () { closeModal(); if (after) after(); });
  }

  function bossReward(gold) {
    G.gold += gold;
    var opts = [], tries = 0;
    while (opts.length < 3 && tries++ < 40) { var r = rollRelic(true) || rollRelic(false); if (r && opts.indexOf(r) < 0) opts.push(r); }
    hud();
    screen.innerHTML = '<div class="panel-wrap"><div class="event-art">🏆</div><p class="dim mono">ACT ' + G.act + ' CLEARED · +' + gold + ' GOLD</p><h2>Deployed to production!</h2>' +
      '<p class="story">Pick a boss relic. Then the next act begins: enemies hit harder, but you have learned a few tricks.</p><div class="shop-grid" id="br"></div></div>';
    opts.forEach(function (k) {
      var r = RELICS[k], d = document.createElement("div");
      d.className = "relic-card"; d.tabIndex = 0;
      d.innerHTML = '<div class="ri">' + r.a + "</div><b>" + esc(r.n) + "</b><p>" + esc(r.x) + "</p>";
      d.addEventListener("click", function () {
        addRelic(k);
        saveRecord();
        G.act++; G.pos = null; G.map = genMap(); G.hp = Math.min(G.maxHp, G.hp + Math.round(G.maxHp * .5));
        showMap();
      });
      $("#br").appendChild(d);
    });
  }

  function saveRecord() {
    Arcade.saveBest("bugslayer-floor", G.floor);
    if (G.act >= 1) Arcade.saveBest("bugslayer-act", G.act);
  }

  function defeat() {
    C.over = true;
    saveRecord();
    setTimeout(function () {
      var g = G;
      screen.innerHTML = '<div class="panel-wrap"><div class="event-art">💀</div><p class="dim mono">SEGMENTATION FAULT (core dumped)</p><h2>Your run has crashed</h2>' +
        '<div class="feature-row" style="max-width:640px">' +
        '<div class="feature"><b>Act ' + g.act + " · Floor " + g.floor + "</b>Reached</div>" +
        '<div class="feature"><b>' + g.kills + "</b>Bugs squashed</div>" +
        '<div class="feature"><b>' + g.cardsPlayed + "</b>Cards played</div>" +
        '<div class="feature"><b>' + g.maxHit + "</b>Biggest hit</div></div>" +
        '<p class="dim">Best floor: ' + Arcade.best("bugslayer-floor") + '</p><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn hot" id="again" type="button">New run</button><button class="btn" id="title" type="button">Title</button></div></div>';
      G = null; C = null; hud();
      $("#again").addEventListener("click", newRun);
      $("#title").addEventListener("click", showTitle);
    }, 900);
  }

  /* ================= rest / shop / treasure / event ================= */
  function showRest() {
    var amt = Math.round(G.maxHp * .3);
    screen.innerHTML = '<div class="panel-wrap"><div class="event-art">☕</div><p class="dim mono">COFFEE BREAK</p><h2>Take five</h2><p class="story">The coffee machine hums. You could rest your eyes, or finally clean up that one function.</p>' +
      '<div class="choices"><button class="choice" id="r-heal" type="button"><b>😴 Rest</b><small>Heal ' + amt + " HP</small></button>" +
      '<button class="choice" id="r-up" type="button"><b>♻️ Refactor</b><small>Upgrade a card in your deck</small></button></div></div>';
    $("#r-heal").addEventListener("click", function () { G.hp = Math.min(G.maxHp, G.hp + amt); hud(); toastBanner("+" + amt + " HP", "#5ff0a5"); setTimeout(showMap, 500); });
    $("#r-up").addEventListener("click", function () {
      pickFromDeck("Upgrade a card", function (c) { return !c.up && CARDS[c.k].r >= 0; }, function (c) { c.up = true; toastBanner(CARDS[c.k].n + "+", "#5ff0a5"); showMap(); }, true);
    });
  }

  function showTreasure() {
    var r = rollRelic(false);
    screen.innerHTML = '<div class="panel-wrap"><div class="event-art">🎁</div><p class="dim mono">TREASURE</p><h2>An unattended laptop</h2><p class="story">Someone left their laptop unlocked. Inside: a gift.</p><div class="shop-grid" id="tr"></div><button class="btn" id="go-on" type="button">Continue →</button></div>';
    if (r) {
      var d = document.createElement("div"); d.className = "relic-card"; d.tabIndex = 0;
      d.innerHTML = '<div class="ri">' + RELICS[r].a + "</div><b>" + esc(RELICS[r].n) + "</b><p>" + esc(RELICS[r].x) + "</p>";
      d.addEventListener("click", function () { addRelic(r); d.classList.add("sold"); });
      $("#tr").appendChild(d);
    } else { G.gold += 100; hud(); $("#tr").innerHTML = "<p class='story'>+100 gold</p>"; }
    $("#go-on").addEventListener("click", showMap);
  }

  function showShop() {
    var items = rollCards(5, 4).map(function (k) {
      var r = CARDS[k].r, price = (r === 3 ? range(140, 160) : r === 2 ? range(68, 82) : range(44, 56));
      return { card: mk(k), price: price };
    });
    var relics = [];
    for (var i = 0; i < 2; i++) { var rk = rollRelic(false); if (rk && relics.every(function (x) { return x.k !== rk; })) relics.push({ k: rk, price: range(140, 175) }); }
    function render() {
      hud();
      screen.innerHTML = '<div class="panel-wrap"><p class="dim mono">PACKAGE STORE</p><h2>npm install anything</h2><p class="dim">You have <b style="color:var(--gold)">◉ ' + G.gold + '</b></p><div class="shop-grid big-cards" id="sc"></div><div class="shop-grid" id="sr"></div>' +
        '<div class="choices" style="width:min(100%,360px)"><button class="choice" id="rm" type="button"' + (G.gold < G.removeCost ? " disabled" : "") + '><b>🗑️ Uninstall a card</b><small>Remove a card from your deck · ◉ ' + G.removeCost + '</small></button></div><button class="btn hot" id="go-on" type="button">Leave →</button></div>';
      items.forEach(function (it) {
        var w = document.createElement("div"); w.className = "shop-item" + (it.sold ? " sold" : "");
        w.innerHTML = cardHTML(it.card) + '<span class="price' + (G.gold < it.price ? " no" : "") + '">◉ ' + it.price + "</span>";
        w.querySelector(".card").addEventListener("click", function () {
          if (it.sold || G.gold < it.price) return;
          G.gold -= it.price; it.sold = true; G.deck.push(it.card); render();
        });
        $("#sc").appendChild(w);
      });
      relics.forEach(function (it) {
        var r = RELICS[it.k], w = document.createElement("div"); w.className = "shop-item" + (it.sold ? " sold" : "");
        w.innerHTML = '<div class="relic-card" tabindex="0"><div class="ri">' + r.a + "</div><b>" + esc(r.n) + "</b><p>" + esc(r.x) + '</p></div><span class="price' + (G.gold < it.price ? " no" : "") + '">◉ ' + it.price + "</span>";
        w.querySelector(".relic-card").addEventListener("click", function () {
          if (it.sold || G.gold < it.price) return;
          G.gold -= it.price; it.sold = true; addRelic(it.k); render();
        });
        $("#sr").appendChild(w);
      });
      $("#rm").addEventListener("click", function () {
        if (G.gold < G.removeCost) return;
        pickFromDeck("Uninstall a card", function () { return true; }, function (c) {
          G.gold -= G.removeCost; G.removeCost += 25;
          G.deck.splice(G.deck.indexOf(c), 1); render();
        }, true);
      });
      $("#go-on").addEventListener("click", showMap);
    }
    render();
  }

  var EVENTS = [
    { id: "friday", a: "🚢", t: "Friday Deploy", s: "It's 4:55 PM on a Friday. The product manager asks for “one tiny change” straight to production.",
      o: [{ b: "Ship it", sm: "50%: gain 90 gold · 50%: lose 14 HP", f: function () { if (Math.random() < .5) { G.gold += 90; return "It worked first try. Nobody believes you. +90 gold."; } hurtRaw(14); return "The pager goes off at 2 AM. −14 HP."; } },
          { b: "Say no, politely", sm: "Heal 8 HP", f: function () { healRaw(8); return "You log off on time. +8 HP."; } }] },
    { id: "hackathon", a: "🏆", t: "Hackathon", s: "48 hours, unlimited pizza, zero sleep. The prize is a mysterious rare card.",
      o: [{ b: "Compete", sm: "Lose 10 HP · gain a random Rare card", f: function () { hurtRaw(10); var k = pick(POOL.filter(function (x) { return CARDS[x].r === 3; })); G.deck.push(mk(k)); return "You won with a demo held together by tape. Gained " + CARDS[k].n + "."; } },
          { b: "Just eat the pizza", sm: "Heal 12 HP", f: function () { healRaw(12); return "Excellent pizza. +12 HP."; } }] },
    { id: "legacy", a: "📜", t: "Legacy Code", s: "You find a 4,000-line function named doEverything(). It has one comment: “don't touch”.",
      o: [{ b: "Refactor it", sm: "Lose 6 HP · upgrade 2 random cards", f: function () { hurtRaw(6); var c = Arcade.shuffle(G.deck.filter(function (x) { return !x.up; })).slice(0, 2); c.forEach(function (x) { x.up = true; }); return "Upgraded: " + c.map(function (x) { return CARDS[x.k].n; }).join(", ") + "."; } },
          { b: "Delete it", sm: "Remove a card from your deck", pick: "remove" }] },
    { id: "oss", a: "🧩", t: "Open Source Bazaar", s: "A maintainer offers you a package with 3 weekly downloads and no README.",
      o: [{ b: "npm install it", sm: "Lose 7 Max HP · gain a random relic", f: function () { G.maxHp -= 7; G.hp = Math.min(G.hp, G.maxHp); var r = rollRelic(false); if (r) addRelic(r); return r ? "It actually works! Gained " + RELICS[r].n + "." : "It was empty."; } },
          { b: "Star it and leave", sm: "Nothing happens", f: function () { return "The maintainer is grateful anyway."; } }] },
    { id: "so", a: "📚", t: "Duplicate Question", s: "Your question was closed as a duplicate of a 2011 answer. Annoyingly, it is exactly right.",
      o: [{ b: "Read the answer", sm: "Upgrade a card", pick: "upgrade" },
          { b: "Argue in the comments", sm: "Lose 5 HP · gain 45 gold (ad revenue?)", f: function () { hurtRaw(5); G.gold += 45; return "You get 40 downvotes and, somehow, 45 gold."; } }] },
    { id: "coffee", a: "☕", t: "The Coffee Machine", s: "It is making a noise like a dial-up modem.",
      o: [{ b: "Kick it", sm: "50%: gain a Coffee card and heal 10 · 50%: lose 6 HP", f: function () { if (Math.random() < .5) { G.deck.push(mk("coffee")); healRaw(10); return "A perfect espresso. Gained Coffee, +10 HP."; } hurtRaw(6); return "It kicks back. −6 HP."; } },
          { b: "Make tea instead", sm: "Heal 6 HP", f: function () { healRaw(6); return "Calm. +6 HP."; } }] }
  ];
  function hurtRaw(n) { G.hp = Math.max(1, G.hp - n); hud(); }
  function healRaw(n) { G.hp = Math.min(G.maxHp, G.hp + n); hud(); }

  function showEvent() {
    var pool = EVENTS.filter(function (e) { return G.seenEvents.indexOf(e.id) < 0; });
    if (!pool.length) { G.seenEvents = []; pool = EVENTS; }
    if (Math.random() < .2) return startCombat(pick(NORMAL), "fight"); // ambush!
    var ev = pick(pool); G.seenEvents.push(ev.id);
    screen.innerHTML = '<div class="panel-wrap"><div class="event-art">' + ev.a + '</div><p class="dim mono">EVENT</p><h2>' + esc(ev.t) + '</h2><p class="story">' + esc(ev.s) + '</p><div class="choices" id="ch"></div></div>';
    ev.o.forEach(function (o) {
      var b = document.createElement("button"); b.type = "button"; b.className = "choice";
      b.innerHTML = "<b>" + esc(o.b) + "</b><small>" + esc(o.sm) + "</small>";
      b.addEventListener("click", function () {
        if (o.pick === "remove") return pickFromDeck("Remove a card", function () { return true; }, function (c) { G.deck.splice(G.deck.indexOf(c), 1); eventResult(ev, CARDS[c.k].n + " deleted. Nobody noticed."); }, false);
        if (o.pick === "upgrade") return pickFromDeck("Upgrade a card", function (c) { return !c.up && CARDS[c.k].r >= 0; }, function (c) { c.up = true; eventResult(ev, CARDS[c.k].n + " upgraded."); }, false);
        eventResult(ev, o.f());
      });
      $("#ch").appendChild(b);
    });
  }
  function eventResult(ev, text) {
    hud();
    screen.innerHTML = '<div class="panel-wrap"><div class="event-art">' + ev.a + '</div><h2>' + esc(ev.t) + '</h2><p class="story">' + esc(text) + '</p><button class="btn hot" id="go-on" type="button">Continue →</button></div>';
    $("#go-on").addEventListener("click", showMap);
  }

  /* ================= modals ================= */
  function closeModal() { modal.hidden = true; modal.innerHTML = ""; }
  modal.addEventListener("click", function (e) { if (e.target === modal && modal.dataset.dismiss) closeModal(); });

  function sortDeck(list) {
    var order = { atk: 0, skl: 1, pow: 2, sts: 3 };
    return list.slice().sort(function (a, b) { return order[CARDS[a.k].t] - order[CARDS[b.k].t] || CARDS[a.k].n.localeCompare(CARDS[b.k].n); });
  }

  function showPile(title, list, filter, onPick, cancellable) {
    modal.dataset.dismiss = onPick && !cancellable ? "" : "1";
    var cards = filter ? list.filter(filter) : list;
    modal.innerHTML = '<div class="modal-box"><div class="modal-head"><h2>' + esc(title) + ' <span class="dim mono" style="font-size:16px">' + cards.length + "</span></h2>" +
      (onPick && !cancellable ? "" : '<button class="btn" id="close" type="button">Close</button>') + '</div>' +
      (cards.length ? '<div class="card-grid">' + cards.map(function (c) { return cardHTML(c, { live: !onPick && !!C }); }).join("") + "</div>" : '<p class="dim">Empty.</p>') + "</div>";
    modal.hidden = false;
    var cl = $("#close", modal); if (cl) cl.addEventListener("click", closeModal);
    if (onPick) $$(".card-grid .card", modal).forEach(function (el, i) {
      el.addEventListener("click", function () { closeModal(); onPick(cards[i]); });
    });
  }
  function pickFromDeck(title, filter, onPick, cancellable) {
    var list = sortDeck(G.deck).filter(filter);
    if (!list.length) { toastBanner("Nothing to choose", "#a59fc9"); return; }
    showPile(title, list, null, onPick, cancellable);
  }

  $("#hud-deck").addEventListener("click", function () { if (G) showPile("Your deck", sortDeck(G.deck)); });
  $("#hud-notes").addEventListener("click", function () {
    modal.dataset.dismiss = "1";
    modal.innerHTML = '<div class="modal-box" style="max-width:720px"><div class="modal-head"><h2>How it\'s built</h2><button class="btn" id="close" type="button">Close</button></div><div class="notes"><ul>' +
      "<li><b>Data-driven content.</b> Every card, enemy, relic and event is a plain object (<code>CARDS</code>, <code>FOES</code>, <code>RELICS</code>, <code>EVENTS</code>). Adding a card is one line; the UI, rewards and shop pick it up automatically.</li>" +
      "<li><b>Damage pipeline.</b> <code>(base + Strength) × Weak × Exposed</code>, then Block absorbs. The same function previews numbers on cards and intents, so what you see is what you get.</li>" +
      "<li><b>Async turn sequencing.</b> Card effects and enemy turns are <code>async</code> functions with short <code>await sleep()</code> beats, which keeps animation timing readable and input locked while things resolve.</li>" +
      "<li><b>Procedural map.</b> Four random walks climb the grid; a step is rejected if it would cross an existing edge, giving StS-style branching with no crossing paths. Room types use weighted rolls with floor rules (no elites early, rest before the boss).</li>" +
      "<li><b>Deck piles.</b> Draw, hand, discard and exhaust are arrays; reshuffle uses Fisher–Yates when the draw pile runs dry.</li>" +
      "<li><b>Intents.</b> Enemy AI is a pure function of its turn counter, so behaviour is telegraphed one turn ahead and is easy to balance.</li>" +
      "<li><b>No framework, no build.</b> One HTML file, CSS animations for juice (card fan, hit-flash, floating numbers, particles, screen shake).</li></ul></div></div>";
    modal.hidden = false;
    $("#close", modal).addEventListener("click", closeModal);
  });

  document.addEventListener("keydown", function (e) {
    if (!modal.hidden) { if (e.key === "Escape" && modal.dataset.dismiss) closeModal(); return; }
    if (!C || C.over) return;
    if (e.key === "e" || e.key === "E") { e.preventDefault(); endTurn(); }
    else if (e.key === "Escape") { C.sel = null; renderHand(); }
    else if (/^[1-9]$/.test(e.key)) { clickCard(Number(e.key) - 1); }
    else if (C.sel != null && (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Enter")) {
      var es = alive();
      if (e.key === "Enter") { var aim = $(".foe.aim"); var t = aim ? C.enemies[Number(aim.dataset.i)] : es[0]; tryPlay(C.sel, t); return; }
      var cur = $(".foe.aim"), idx = cur ? es.indexOf(C.enemies[Number(cur.dataset.i)]) : -1;
      idx = (idx + (e.key === "ArrowRight" ? 1 : es.length - 1)) % es.length;
      $$(".foe").forEach(function (f) { f.classList.remove("aim"); });
      es[idx].el.classList.add("aim");
    }
  });

  window.addEventListener("resize", function () { if (C && !C.over && $("#hand")) renderHand(); });

  /* ================= title ================= */
  function showTitle() {
    G = null; C = null; hud();
    var bestF = Arcade.best("bugslayer-floor"), bestA = Arcade.best("bugslayer-act");
    screen.innerHTML = '<div class="title-wrap"><div class="floaty" aria-hidden="true"><span>🐛</span><span>🧑‍💻</span><span>🗿</span></div>' +
      '<h1 class="logo">BUG SLAYER</h1><p class="tagline">A roguelike deckbuilder for developers. Build a deck of code, climb the legacy codebase, and ship before the bugs ship you.</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn hot" id="start" type="button" style="font-size:18px;padding:14px 28px">▶ New run</button></div>' +
      (bestF ? '<p class="mono dim">Best: floor ' + bestF + (bestA > 1 ? " · act " + bestA : "") + "</p>" : "") +
      '<div class="feature-row"><div class="feature"><b>🃏 24 cards</b>Attacks, skills and powers. Upgrade them over coffee.</div>' +
      '<div class="feature"><b>🗺️ Branching map</b>Fights, elites, shops, events and rest stops.</div>' +
      '<div class="feature"><b>🧿 13 relics</b>Passive perks that change how you build.</div>' +
      '<div class="feature"><b>♾️ Endless acts</b>Beat the boss, then climb harder acts.</div></div>' +
      '<p class="dim" style="font-size:13px">Click a card to play it · with several enemies, click the card then the target · <span class="mono">1–9</span> cards · <span class="mono">E</span> end turn</p></div>';
    $("#start").addEventListener("click", newRun);
  }

  showTitle();
})();
</script>
</body>
</html>
