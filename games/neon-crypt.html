<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Crypt · Mini Arcade</title>
<meta name="description" content="A turn-based roguelike: procedural dungeons, field of view, dynamic lighting, pixel art and level-up perks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070912'/%3E%3Crect x='9' y='7' width='14' height='18' rx='3' fill='none' stroke='%233ef0ff' stroke-width='2.5'/%3E%3Crect x='12' y='12' width='8' height='3' fill='%23ff4fa3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="games.js"></script>
<style>
/* Neon Crypt: canvas dungeon on the left, character sheet / inventory / log on the right.
   On phones the sheet drops below the canvas and an on-screen d-pad appears. */
:root {
  --bg: #05060d; --panel: rgb(255 255 255 / .05); --line: rgb(120 220 255 / .14); --text: #e8f3ff; --dim: #8a9bb8;
  --cyan: #3ef0ff; --pink: #ff4fa3; --violet: #9b6bff; --hp: #ff3b5c; --xp: #ffcf4a; --good: #5dffa0;
  --display: "Bricolage Grotesque", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; overflow-x: clip; }
body { background: var(--bg); color: var(--text); font: 400 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(60% 50% at 20% 0%, rgb(62 240 255 / .1), transparent 70%), radial-gradient(50% 50% at 90% 100%, rgb(255 79 163 / .1), transparent 70%); }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.05; }
p { margin: 0; }
.mono { font-family: var(--mono); } .dim { color: var(--dim); }
.hud { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: rgb(5 6 13 / .8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hud a { font: 500 13px var(--mono); color: var(--dim); text-decoration: none; padding: 6px 8px; border-radius: 8px; }
.hud a:hover { color: var(--text); background: var(--panel); }
.hud .logo { font: 800 19px var(--display); letter-spacing: .02em; color: var(--cyan); text-shadow: 0 0 12px var(--cyan); }
.hud .logo span { color: var(--pink); text-shadow: 0 0 12px var(--pink); }
.hud .sp { flex: 1; }
.hud .ib { padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 12px; border: 1px solid var(--cyan); background: rgb(62 240 255 / .1);
  color: var(--cyan); font-weight: 700; text-shadow: 0 0 10px rgb(62 240 255 / .6); box-shadow: 0 0 20px -6px var(--cyan), inset 0 0 12px -6px var(--cyan); transition: background .15s, transform .1s; }
.btn:hover { background: rgb(62 240 255 / .2); } .btn:active { transform: translateY(1px); }
.btn.pink { border-color: var(--pink); color: var(--pink); background: rgb(255 79 163 / .1); text-shadow: 0 0 10px rgb(255 79 163 / .6); box-shadow: 0 0 20px -6px var(--pink); }

.game { display: grid; align-items: start; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; max-width: 1320px; margin: 0 auto; padding: 14px; }
.view { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 0 40px -14px rgb(62 240 255 / .4); background: #000; touch-action: none; }
#cv { display: block; width: 100%; height: min(72vh, 680px); image-rendering: pixelated; }
.fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; display: grid; place-items: center; font: 800 34px var(--display); color: var(--cyan); text-shadow: 0 0 20px var(--cyan); }
.fade.on { opacity: 1; }
.sheet { display: grid; gap: 10px; align-content: start; }
.box { background: rgb(10 14 28 / .85); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lv { font: 800 22px var(--display); }
.bar { position: relative; height: 14px; border-radius: 99px; background: rgb(255 255 255 / .07); overflow: hidden; margin-top: 6px; }
.bar i { position: absolute; inset: 0 auto 0 0; transition: width .25s; border-radius: 99px; }
.bar.hp i { background: linear-gradient(90deg, #ff2d55, #ff7a8f); box-shadow: 0 0 10px #ff2d55; }
.bar.xp i { background: linear-gradient(90deg, #ffb020, #ffe07a); box-shadow: 0 0 10px #ffb020; }
.bar span { position: relative; display: block; text-align: center; font: 600 10px/14px var(--mono); text-shadow: 0 1px 2px #000; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.stats div { text-align: center; padding: 6px 4px; border-radius: 10px; background: rgb(255 255 255 / .04); }
.stats span { display: block; font: 500 10px var(--mono); color: var(--dim); letter-spacing: .08em; }
.stats b { font: 700 18px var(--display); }
.inv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.slot { position: relative; display: grid; justify-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; border: 1px solid var(--line); background: rgb(255 255 255 / .03); font-size: 12px; color: var(--dim); }
.slot:hover { border-color: var(--cyan); }
.slot .ic { font-size: 24px; }
.slot b { color: var(--text); font: 700 13px var(--mono); }
.slot kbd { position: absolute; top: 4px; left: 6px; font: 600 10px var(--mono); color: var(--dim); }
.slot[disabled] { opacity: .35; pointer-events: none; }
.perks { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; }
.perk { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: rgb(155 107 255 / .15); border: 1px solid rgb(155 107 255 / .4); font-size: 16px; cursor: help; position: relative; }
.perk b { position: absolute; right: -4px; bottom: -4px; font: 700 10px var(--mono); background: var(--violet); border-radius: 6px; padding: 0 3px; }
#mini { width: 100%; height: auto; display: block; image-rendering: pixelated; border-radius: 8px; background: #000; }
.log { font: 400 12px/1.5 var(--mono); height: 120px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.log p { color: var(--dim); }
.log p:last-child { color: var(--text); }
.log .bad { color: #ff8da0; } .log .good { color: var(--good); } .log .gold { color: var(--xp); } .log .info { color: var(--cyan); }
.label { font: 600 10px var(--mono); letter-spacing: .1em; color: var(--dim); text-transform: uppercase; margin-bottom: 6px; }
.dpad { display: none; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 52px); gap: 6px; justify-content: center; }
.dpad button { border-radius: 12px; border: 1px solid var(--line); background: rgb(62 240 255 / .06); font-size: 20px; color: var(--cyan); touch-action: manipulation; }
.dpad button:active { background: rgb(62 240 255 / .25); }
.dpad .u { grid-column: 2; } .dpad .l { grid-column: 1; grid-row: 2; } .dpad .w { grid-column: 2; grid-row: 2; font-size: 13px; } .dpad .r { grid-column: 3; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 3; }
@media (pointer: coarse) { .dpad { display: grid; } }
.keys { font-size: 12px; color: var(--dim); }
kbd { font: 600 11px var(--mono); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line); background: rgb(255 255 255 / .05); }

.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px 16px; overflow-y: auto; background: rgb(2 3 8 / .82); backdrop-filter: blur(5px); }
.mbox { width: min(100%, 820px); display: grid; gap: 18px; justify-items: center; text-align: center; }
.mbox h2 { font-size: clamp(30px, 5vw, 46px); color: var(--xp); text-shadow: 0 0 24px rgb(255 207 74 / .6); }
.perk-cards { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.pcard { width: 200px; padding: 20px 16px; border-radius: 18px; border: 1px solid rgb(155 107 255 / .5); background: linear-gradient(170deg, rgb(155 107 255 / .22), rgb(10 14 28 / .95) 60%);
  display: grid; gap: 8px; justify-items: center; transition: transform .18s, box-shadow .18s, border-color .18s; animation: rise .4s backwards; }
.pcard:nth-child(2) { animation-delay: .08s; } .pcard:nth-child(3) { animation-delay: .16s; }
@keyframes rise { from { opacity: 0; transform: translateY(30px) scale(.9); } }
.pcard:hover, .pcard:focus { transform: translateY(-8px); border-color: var(--xp); box-shadow: 0 0 40px -10px var(--xp); outline: none; }
.pcard .pi { font-size: 46px; filter: drop-shadow(0 0 14px rgb(155 107 255 / .8)); }
.pcard b { font: 800 19px var(--display); }
.pcard p { color: var(--dim); font-size: 13px; }
.pcard kbd { margin-top: 4px; }
.notes { text-align: left; background: rgb(10 14 28 / .9); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; }
.notes ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: #cfdcf0; }
.notes code { font: 500 .9em var(--mono); background: rgb(255 255 255 / .08); padding: 1px 5px; border-radius: 5px; }
.title-scr { display: grid; gap: 18px; justify-items: center; text-align: center; padding: 8vh 16px 40px; max-width: 760px; margin: 0 auto; }
.title-scr h1 { font: 800 clamp(58px, 12vw, 124px)/.9 var(--display); letter-spacing: -.02em; color: #fff;
  text-shadow: 0 0 8px var(--cyan), 0 0 24px var(--cyan), 0 0 60px rgb(62 240 255 / .6); animation: flicker 4s infinite; }
.title-scr h1 span { text-shadow: 0 0 8px var(--pink), 0 0 24px var(--pink), 0 0 60px rgb(255 79 163 / .6); }
@keyframes flicker { 0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; } 20%, 63% { opacity: .55; } }
.sprites { display: flex; gap: 16px; justify-content: center; }
.sprites canvas { width: 56px; height: 56px; image-rendering: pixelated; animation: hop 1.6s ease-in-out infinite; }
.sprites canvas:nth-child(2n) { animation-delay: -.8s; }
@keyframes hop { 50% { transform: translateY(-8px); } }
.feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; width: 100%; }
.feat div { text-align: left; padding: 12px 14px; border-radius: 14px; background: rgb(10 14 28 / .8); border: 1px solid var(--line); font-size: 13px; color: var(--dim); }
.feat b { display: block; color: var(--text); font-size: 15px; }
.endstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; width: min(100%, 600px); }
.endstats div { padding: 12px; border-radius: 12px; background: rgb(255 255 255 / .05); border: 1px solid var(--line); }
.endstats b { display: block; font: 800 24px var(--display); color: var(--cyan); }

@media (max-width: 900px) {
  .game { grid-template-columns: 1fr; padding: 8px; }
  #cv { height: min(58vh, 520px); }
  .sheet { grid-template-columns: 1fr 1fr; }
  .sheet .wide { grid-column: 1 / -1; }
  .log { height: 90px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<header class="hud">
  <a href="./">← Arcade</a>
  <span class="logo">NEON <span>CRYPT</span></span>
  <span class="sp"></span>
  <span class="mono dim" id="h-depth"></span>
  <button class="ib" id="b-notes" type="button" title="How it's built">ⓘ</button>
</header>
<div id="root"></div>
<div class="modal" id="modal" hidden></div>

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
  var rnd = function (n) { return Math.floor(Math.random() * n); };
  var range = function (a, b) { return a + rnd(b - a + 1); };
  var pick = function (a) { return a[rnd(a.length)]; };
  var esc = Arcade.escape;
  var root = $("#root"), modal = $("#modal");

  /* ================= pixel art ================= */
  // 8×8 sprites as strings; each letter maps to a colour in the sprite's palette, "." is transparent.
  var ART = {
    player: { p: { a: "#2b2f4a", b: "#8f9bc4", c: "#3ef0ff", d: "#d6dcf5", e: "#ff4fa3", f: "#4a4f6e" },
      s: ["..aaaa..", ".abbbba.", ".acccca.", ".abbbba.", "dbbeebbd", ".bbbbbb.", ".bb..bb.", ".ff..ff."] },
    slime: { p: { a: "#1f7a3f", b: "#49e07d", c: "#c9ffd9", d: "#0b2a16" },
      s: ["........", "...aa...", "..abba..", ".abcbba.", ".abbbbba", "abdbbdba", "abbbbbba", ".aaaaaa."] },
    bat: { p: { a: "#7b4fe8", b: "#3b2470", c: "#ff3b6b" },
      s: ["........", "a......a", "aa.bb.aa", "aaabbaaa", "aabcbcaa", ".a.bb.a.", "...bb...", "........"] },
    skeleton: { p: { a: "#ece8d6", b: "#151525", c: "#b9b39c" },
      s: ["..aaaa..", ".aaaaaa.", ".abaaba.", "..acca..", "...aa...", ".aaaaaa.", "..a..a..", ".aa..aa."] },
    goblin: { p: { a: "#3a9a3a", b: "#5fd35f", c: "#ff3030", d: "#ffffff", e: "#8a5a2a", f: "#3a2a1a" },
      s: ["........", "a.bbbb.a", "aabbbbaa", ".bcbbcb.", ".bbddbb.", "..bbbb..", ".ebbbbe.", "..f..f.."] },
    ghost: { p: { a: "#a8e2ff", b: "#12203a" },
      s: ["..aaaa..", ".aaaaaa.", ".abaaba.", ".aaaaaa.", "aaabbaaa", "aaaaaaaa", "aaaaaaaa", "a.aa.aa."] },
    orc: { p: { a: "#6b4a2a", b: "#8fae4a", c: "#ffde3a", d: "#ffffff", e: "#5a5a6a", f: "#2a2018" },
      s: ["..bbbb..", ".bbbbbb.", ".bcbbcb.", ".bdbbdb.", "eebbbbee", "e.aaaa.e", "..aaaa..", ".ff..ff."] },
    lich: { p: { a: "#ffcf4a", b: "#e3dcc8", c: "#5fff9b", d: "#6a2fa8", e: "#2a1048" },
      s: [".a.aa.a.", ".aaaaaa.", ".bbbbbb.", ".bcbbcb.", ".bbeebb.", "ddbbbbdd", ".dddddd.", "dddddddd"] },
    potion: { p: { a: "#b07a3a", b: "#cfe8ff", c: "#ff3b5c", d: "#ffc2cc" },
      s: ["...aa...", "...bb...", "..bbbb..", ".bccccb.", ".bcdccb.", ".bccccb.", "..bbbb..", "........"] },
    gold: { p: { a: "#b8860b", b: "#ffd84a", c: "#fff2b0" },
      s: ["........", "..aaaa..", ".abcbba.", ".abbbba.", ".abbbba.", "..aaaa..", "........", "........"] },
    sword: { p: { a: "#f0f8ff", b: "#9fb3c8", c: "#ffcf4a", d: "#7a5232" },
      s: [".......a", "......ab", ".....ab.", "....ab..", ".c.ab...", "..cb....", ".dcc....", "d......."] },
    shield: { p: { a: "#4a5a7a", b: "#8fb0e0", c: "#3ef0ff" },
      s: [".aaaaaa.", "abbbbbba", "abbccbba", "abccccba", "abbccbba", ".abbbba.", "..abba..", "...aa..."] },
    fire: { p: { a: "#b07a3a", b: "#ffe9c2", c: "#ff5a1f", d: "#ffcf4a" },
      s: ["........", ".aaaaaa.", ".bbbbbb.", ".bbdcbb.", ".bdccbb.", ".bbbbbb.", ".aaaaaa.", "........"] },
    blink: { p: { a: "#b07a3a", b: "#ffe9c2", c: "#9b6bff", d: "#3ef0ff" },
      s: ["........", ".aaaaaa.", ".bbbbbb.", ".bbcdbb.", ".bdcbbb.", ".bbbbbb.", ".aaaaaa.", "........"] },
    chest: { p: { a: "#4a2e14", b: "#a0703a", c: "#ffcf4a" },
      s: ["........", ".aaaaaa.", "abbbbbba", "abbccbba", "aaaccaaa", "abbbbbba", "abbbbbba", ".aaaaaa."] }
  };
  var SPR = {}, WHITE = {};
  function bake(def, white) {
    var c = document.createElement("canvas"); c.width = c.height = 8;
    var x = c.getContext("2d");
    def.s.forEach(function (row, y) {
      for (var i = 0; i < 8; i++) { var ch = row[i]; if (ch === ".") continue; x.fillStyle = white ? "#fff" : def.p[ch]; x.fillRect(i, y, 1, 1); }
    });
    return c;
  }
  Object.keys(ART).forEach(function (k) { SPR[k] = bake(ART[k]); WHITE[k] = bake(ART[k], true); });

  /* ================= content ================= */
  var MONSTERS = {
    slime:    { n: "Slime", hp: 8, atk: 3, def: 0, xp: 3, d: 1, w: 5, glow: "#49e07d" },
    bat:      { n: "Bat", hp: 6, atk: 2, def: 0, xp: 3, d: 1, w: 4, fast: 1, erratic: 1, glow: "#7b4fe8" },
    goblin:   { n: "Goblin", hp: 12, atk: 4, def: 1, xp: 5, d: 2, w: 4, glow: "#5fd35f" },
    skeleton: { n: "Skeleton", hp: 15, atk: 5, def: 1, xp: 6, d: 2, w: 4, glow: "#ece8d6" },
    ghost:    { n: "Ghost", hp: 16, atk: 6, def: 0, xp: 8, d: 4, w: 3, phase: 1, glow: "#a8e2ff" },
    orc:      { n: "Orc Brute", hp: 30, atk: 8, def: 2, xp: 14, d: 5, w: 3, glow: "#ffde3a" },
    lich:     { n: "The Lich", hp: 90, atk: 10, def: 3, xp: 70, d: 99, w: 0, boss: 1, glow: "#5fff9b" }
  };
  var PERKS = [
    { k: "brawn", n: "Brawn", i: "💪", x: "+2 attack", f: function () { P.atk += 2; } },
    { k: "iron", n: "Iron Skin", i: "🛡️", x: "+1 defence", f: function () { P.def += 1; } },
    { k: "vital", n: "Vitality", i: "❤️", x: "+12 max HP, heal 12", f: function () { P.max += 12; P.hp += 12; } },
    { k: "vamp", n: "Vampiric", i: "🩸", x: "Heal 2 HP on every kill", f: function () { P.vamp += 2; } },
    { k: "keen", n: "Keen Edge", i: "🗡️", x: "+12% chance to crit for double damage", f: function () { P.crit += .12; } },
    { k: "thorns", n: "Thorns", i: "🌵", x: "Attackers take 2 damage back", f: function () { P.thorns += 2; } },
    { k: "greed", n: "Greed", i: "💰", x: "+50% gold from every pile", f: function () { P.greed += .5; } },
    { k: "alch", n: "Alchemist", i: "⚗️", x: "Potions heal 25% more and you find more of them", f: function () { P.alch += .25; } },
    { k: "cleave", n: "Cleave", i: "🌀", x: "Attacks splash half damage to other adjacent enemies", f: function () { P.cleave = true; }, once: 1 },
    { k: "regen", n: "Regeneration", i: "🌿", x: "Recover 1 HP every 4 turns", f: function () { P.regen += 1; } },
    { k: "sight", n: "Far Sight", i: "👁️", x: "See 2 tiles further in the dark", f: function () { P.sight += 2; } },
    { k: "dodge", n: "Shadowstep", i: "💨", x: "+10% chance to dodge attacks", f: function () { P.dodge += .1; } }
  ];

  /* ================= state ================= */
  var MW = 60, MH = 42;
  var map, explored, vis, dist, rooms, mons, items, torches, stairs, depth, P, turn, log, fx, particles, shake, busy, dead, stairsOpen, bossAlive, stats;

  function newGame() {
    P = { x: 0, y: 0, rx: 0, ry: 0, hp: 30, max: 30, atk: 5, def: 1, lvl: 1, xp: 0, next: 12, gold: 0, potions: 1, fire: 0, blink: 1,
          vamp: 0, crit: .05, thorns: 0, greed: 0, alch: 0, cleave: false, regen: 0, sight: 0, dodge: 0, perks: {}, bump: null, flash: 0 };
    depth = 0; dead = false; log = []; stats = { kills: 0, turns: 0, bestHit: 0 };
    buildUI();
    descend(true);
  }

  /* ================= dungeon generation ================= */
  function idx(x, y) { return y * MW + x; }
  function inb(x, y) { return x >= 0 && y >= 0 && x < MW && y < MH; }
  function nearFloor(x, y) {
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) if (walk(x + dx, y + dy)) return true;
    return false;
  }
  function walk(x, y) { return inb(x, y) && map[idx(x, y)] !== 0; }
  function carve(x, y) { if (inb(x, y)) map[idx(x, y)] = 1; }

  function genLevel() {
    map = new Uint8Array(MW * MH); explored = new Uint8Array(MW * MH); vis = new Uint8Array(MW * MH);
    rooms = []; mons = []; items = []; torches = []; particles = []; fx = [];
    for (var t = 0; t < 400 && rooms.length < 14; t++) {
      var w = range(5, 10), h = range(4, 8), x = range(1, MW - w - 2), y = range(1, MH - h - 2);
      var ok = rooms.every(function (r) { return x + w + 2 < r.x || r.x + r.w + 2 < x || y + h + 2 < r.y || r.y + r.h + 2 < y; });
      if (!ok) continue;
      rooms.push({ x: x, y: y, w: w, h: h, cx: x + (w >> 1), cy: y + (h >> 1) });
      for (var yy = y; yy < y + h; yy++) for (var xx = x; xx < x + w; xx++) carve(xx, yy);
    }
    rooms.sort(function (a, b) { return a.cx - b.cx; });
    function corridor(a, b) {

  function weighted(keys) {

  function rollItem() {

  function levelUpModal() {

      ctx.fillStyle = v < .5 ? "#141b36" : "#161e3b"; ctx.fillRect(sx, sy, T, T);
      ctx.fillStyle = "rgba(62,240,255,.07)"; ctx.fillRect(sx, sy, T, 1); ctx.fillRect(sx, sy, 1, T);
      if (v > .86) { ctx.fillStyle = "rgba(93,255,160,.12)"; ctx.fillRect(sx + T * .2, sy + T * .6, T * .25, T * .12); ctx.fillRect(sx + T * .3, sy + T * .5, T * .1, T * .1); }
      else if (v < .08) { ctx.strokeStyle = "rgba(255,255,255,.07)"; ctx.beginPath(); ctx.moveTo(sx + T * .2, sy + T * .3); ctx.lineTo(sx + T * .5, sy + T * .5); ctx.lineTo(sx + T * .45, sy + T * .8); ctx.stroke(); }
      if (t === 2) {
        var pulse = .6 + Math.sin(now / 300) * .25;
        ctx.fillStyle = "rgba(155,107,255," + pulse + ")"; ctx.fillRect(sx + 3, sy + 3, T - 6, T - 6);
        ctx.fillStyle = "#05060d";
        for (var s = 0; s < 3; s++) ctx.fillRect(sx + 6 + s * 3, sy + 7 + s * (T - 14) / 3, T - 12 - s * 6, (T - 14) / 3 - 2);
      }
    }
  }

  function drawSprite(key, x, y, flash, alpha, scale, bob) {
    var s = (scale || 1) * T, ox = x + (T - s) / 2, oy = y + (T - s) - (bob || 0);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.beginPath(); ctx.ellipse(x + T / 2, y + T - 3, s * .32, s * .1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(flash > 0 ? WHITE[key] : SPR[key], ox, oy, s, s);
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!cv || !map) return;
    var dt = Math.min(50, now - (last || now)); last = now;
    var k = 1 - Math.pow(.0005, dt / 1000 * 2.5);
    P.rx += (P.x - P.rx) * k * 2.2; P.ry += (P.y - P.ry) * k * 2.2;
    if (Math.abs(P.x - P.rx) > 6 || Math.abs(P.y - P.ry) > 6) { P.rx = P.x; P.ry = P.y; }
    mons.forEach(function (m) { m.rx += (m.x - m.rx) * k * 2; m.ry += (m.y - m.ry) * k * 2; });

    var tcx = P.rx * T + T / 2 - VW / 2, tcy = P.ry * T + T / 2 - VH / 2;
    camX = tcx; camY = tcy; // always centred on the hero; the void past the map edge stays black
    var sx0 = camX, sy0 = camY;
    if (shake > 0) { sx0 += (Math.random() - .5) * shake; sy0 += (Math.random() - .5) * shake; shake *= .86; if (shake < .3) shake = 0; }

    ctx.fillStyle = "#020309"; ctx.fillRect(0, 0, VW, VH);
    var x0 = Math.max(0, Math.floor(sx0 / T)), y0 = Math.max(0, Math.floor(sy0 / T));
    var x1 = Math.min(MW - 1, Math.ceil((sx0 + VW) / T)), y1 = Math.min(MH - 1, Math.ceil((sy0 + VH) / T));
    for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) {
      var i = idx(x, y);
      if (!explored[i]) continue;
      var px = Math.round(x * T - sx0), py = Math.round(y * T - sy0);
      drawTile(x, y, px, py, now);
      if (!vis[i]) { ctx.fillStyle = "rgba(2,3,12,.55)"; ctx.fillRect(px, py, T, T); }
    }
    // torches
    torches.forEach(function (t) {
      if (!explored[idx(t.x, t.y)]) return;
      var px = t.x * T - sx0, py = t.y * T - sy0, fl = Math.sin(now / 90 + t.ph) * 2;
      ctx.fillStyle = "#3a2a1a"; ctx.fillRect(px + T / 2 - 2, py + T * .45, 4, T * .3);
      ctx.fillStyle = "#ff8a1f"; ctx.fillRect(px + T / 2 - 4, py + T * .22 - fl / 2, 8, 9 + fl);
      ctx.fillStyle = "#ffe07a"; ctx.fillRect(px + T / 2 - 2, py + T * .3 - fl / 2, 4, 5 + fl / 2);
    });
    // items
    items.forEach(function (it) {
      if (!vis[idx(it.x, it.y)]) { if (explored[idx(it.x, it.y)]) drawSprite(it.k, it.x * T - sx0, it.y * T - sy0, 0, .3, .7); return; }
      drawSprite(it.k, it.x * T - sx0, it.y * T - sy0, 0, 1, it.k === "chest" ? .9 : .7, Math.sin(now / 400 + it.ph) * 2 + 2);
    });
    // monsters
    mons.forEach(function (m) {
      if (m.hp <= 0 || !vis[idx(m.x, m.y)]) return;
      var b = MONSTERS[m.k], bx = 0, by = 0;
      if (m.bump) { var e = Math.sin(m.bump.t * Math.PI); bx = m.bump.dx * e * T * .3; by = m.bump.dy * e * T * .3; m.bump.t -= dt / 160; if (m.bump.t <= 0) m.bump = null; }
      var px = m.rx * T - sx0 + bx, py = m.ry * T - sy0 + by;
      var bob = b.erratic ? Math.sin(now / 90 + m.x) * 3 + 4 : b.phase ? Math.sin(now / 300) * 3 + 3 : Math.abs(Math.sin(now / 260 + m.x * 1.3)) * 2;
      drawSprite(m.k, px, py, m.flash, b.phase ? .75 : 1, b.boss ? 1.35 : m.k === "orc" ? 1.15 : .95, bob);
      if (m.flash > 0) m.flash -= dt / 120;
      if (m.hp < m.max || b.boss) {
        var w = T * (b.boss ? 1.4 : .8), hx = px + (T - w) / 2, hy = py - (b.boss ? 14 : 6);
        ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(hx - 1, hy - 1, w + 2, 5);
        ctx.fillStyle = b.boss ? "#5fff9b" : "#ff3b5c"; ctx.fillRect(hx, hy, w * Math.max(0, m.hp) / m.max, 3);
      }
      if (!m.awake) { ctx.fillStyle = "#8a9bb8"; ctx.font = "700 " + Math.round(T * .35) + "px IBM Plex Mono, monospace"; ctx.fillText("z", px + T * .72, py + T * .2 - Math.sin(now / 400) * 3); }
    });
    // player
    var pbx = 0, pby = 0;
    if (P.bump) { var pe = Math.sin(P.bump.t * Math.PI); pbx = P.bump.dx * pe * T * .35; pby = P.bump.dy * pe * T * .35; P.bump.t -= dt / 140; if (P.bump.t <= 0) P.bump = null; }
    if (!dead) drawSprite("player", P.rx * T - sx0 + pbx, P.ry * T - sy0 + pby, P.flash, 1, 1, Math.abs(Math.sin(now / 300)) * 1.5);
    if (P.flash > 0) P.flash -= dt / 120;

    // lighting: darkness with holes cut out for the player's lantern and torches
    lctx.globalCompositeOperation = "source-over";
    lctx.clearRect(0, 0, VW, VH);
    lctx.fillStyle = "rgba(2,3,10,.5)"; lctx.fillRect(0, 0, VW, VH);
    lctx.globalCompositeOperation = "destination-out";
    function hole(cx, cy, r, a) {
      var g = lctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, "rgba(0,0,0," + a + ")"); g.addColorStop(.6, "rgba(0,0,0," + a * .55 + ")"); g.addColorStop(1, "rgba(0,0,0,0)");
      lctx.fillStyle = g; lctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
    var pcx = P.rx * T - sx0 + T / 2, pcy = P.ry * T - sy0 + T / 2, lr = (radius() + .5) * T * (1 + Math.sin(now / 500) * .015);
    hole(pcx, pcy, lr, 1);
    torches.forEach(function (t) { if (vis[idx(t.x, t.y)]) hole(t.x * T - sx0 + T / 2, t.y * T - sy0 + T * .6, T * (3.2 + Math.sin(now / 120 + t.ph) * .15), .8); });
    ctx.drawImage(light, 0, 0, VW, VH);
    // coloured glow
    ctx.globalCompositeOperation = "lighter";
    function glow(cx, cy, r, col) {
      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
    glow(pcx, pcy, T * 4, "rgba(255,150,70,.10)");
    torches.forEach(function (t) { if (vis[idx(t.x, t.y)]) glow(t.x * T - sx0 + T / 2, t.y * T - sy0 + T * .35, T * 2.6, "rgba(255,120,40,.16)"); });
    if (stairsOpen && vis[idx(stairs.x, stairs.y)]) glow(stairs.x * T - sx0 + T / 2, stairs.y * T - sy0 + T / 2, T * 2.5, "rgba(155,107,255," + (.25 + Math.sin(now / 300) * .08) + ")");
    items.forEach(function (it) { if (vis[idx(it.x, it.y)] && it.k !== "gold") glow(it.x * T - sx0 + T / 2, it.y * T - sy0 + T / 2, T * 1.1, it.k === "potion" ? "rgba(255,59,92,.18)" : "rgba(62,240,255,.14)"); });
    mons.forEach(function (m) { if (m.hp > 0 && vis[idx(m.x, m.y)] && MONSTERS[m.k].boss) glow(m.rx * T - sx0 + T / 2, m.ry * T - sy0 + T / 2, T * 3, "rgba(95,255,155,.18)"); });
    ctx.globalCompositeOperation = "source-over";

    // particles
    particles = particles.filter(function (p) {
      p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.vy += .003 * dt / 16; p.life -= dt / 700;
      if (p.life <= 0) return false;
      ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c;
      ctx.fillRect(p.x * T - sx0, p.y * T - sy0, p.s, p.s);
      return true;
    });
    ctx.globalAlpha = 1;
    // floating text
    ctx.textAlign = "center";
    fx = fx.filter(function (f) {
      f.life -= dt / 900;
      if (f.life <= 0) return false;
      var rise = (1 - f.life) * T * 1.2;
      ctx.globalAlpha = Math.min(1, f.life * 2);
      ctx.font = "800 " + Math.round(T * .5 * f.s) + "px Bricolage Grotesque, system-ui, sans-serif";
      ctx.fillStyle = "#000"; ctx.fillText(f.t, f.x * T - sx0 + T / 2 + 2, f.y * T - sy0 - rise + 2);
      ctx.fillStyle = f.c; ctx.fillText(f.t, f.x * T - sx0 + T / 2, f.y * T - sy0 - rise);
      return true;
    });
    ctx.globalAlpha = 1; ctx.textAlign = "left";
    // low-health vignette
    if (P.hp / P.max < .3 && !dead) {
      var g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * .3, VW / 2, VH / 2, Math.max(VW, VH) * .7);
      g.addColorStop(0, "rgba(255,0,40,0)"); g.addColorStop(1, "rgba(255,0,40," + (.25 + Math.sin(now / 200) * .08) + ")");
      ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    }
    drawMini();
  }

  function drawMini() {
    if (!mctx) return;
    mctx.fillStyle = "#000"; mctx.fillRect(0, 0, MW, MH);
    for (var y = 0; y < MH; y++) for (var x = 0; x < MW; x++) {
      var i = idx(x, y);
      if (!explored[i] || map[i] === 0) continue;
      mctx.fillStyle = map[i] === 2 ? "#9b6bff" : vis[i] ? "#2a4a6a" : "#16243a";
      mctx.fillRect(x, y, 1, 1);
    }
    mons.forEach(function (m) { if (m.hp > 0 && vis[idx(m.x, m.y)]) { mctx.fillStyle = "#ff3b5c"; mctx.fillRect(m.x, m.y, 1, 1); } });
    mctx.fillStyle = "#3ef0ff"; mctx.fillRect(P.x, P.y, 1, 1);
  }

  /* ================= UI ================= */
  function buildUI() {
    root.innerHTML = '<div class="game"><div class="view" id="view"><canvas id="cv" aria-label="Dungeon view"></canvas><div class="fade" id="fade"></div></div>' +
      '<aside class="sheet">' +
        '<div class="box wide"><div class="row"><span class="lv" id="u-lv">Lv 1</span><span class="mono dim" id="u-gold">0 gold</span></div>' +
          '<div class="bar hp"><i id="u-hpb"></i><span id="u-hp">30/30</span></div><div class="bar xp"><i id="u-xpb"></i><span id="u-xp">0/12 XP</span></div>' +
          '<div class="stats"><div><span>ATK</span><b id="u-atk">5</b></div><div><span>DEF</span><b id="u-def">1</b></div><div><span>CRIT</span><b id="u-crit">5%</b></div></div></div>' +
        '<div class="box"><div class="label">Items</div><div class="inv">' +
          '<button class="slot" id="i-pot" type="button"><kbd>1</kbd><span class="ic">🧪</span><b id="i-potn">1</b>Heal</button>' +
          '<button class="slot" id="i-fire" type="button"><kbd>2</kbd><span class="ic">🔥</span><b id="i-firen">0</b>Fire</button>' +
          '<button class="slot" id="i-blink" type="button"><kbd>3</kbd><span class="ic">✨</span><b id="i-blinkn">1</b>Blink</button></div></div>' +
        '<div class="box"><div class="label">Map</div><canvas id="mini" width="' + MW + '" height="' + MH + '"></canvas></div>' +
        '<div class="box"><div class="label">Perks</div><div class="perks" id="u-perks"></div></div>' +
        '<div class="box wide"><div class="log" id="u-log" aria-live="polite"></div></div>' +
        '<div class="wide"><div class="dpad"><button class="u" data-d="u" aria-label="Up">▲</button><button class="l" data-d="l" aria-label="Left">◀</button><button class="w" data-d="w" aria-label="Wait">wait</button><button class="r" data-d="r" aria-label="Right">▶</button><button class="d" data-d="d" aria-label="Down">▼</button></div>' +
        '<p class="keys"><kbd>WASD</kbd>/<kbd>arrows</kbd> move &amp; attack · <kbd>Space</kbd> wait · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> items · walk onto glowing stairs to descend</p></div>' +
      "</aside></div>";
    cv = $("#cv"); ctx = cv.getContext("2d");
    light = document.createElement("canvas"); lctx = light.getContext("2d");
    mini = $("#mini"); mctx = mini.getContext("2d");
    resize();
    $("#i-pot").addEventListener("click", usePotion);
    $("#i-fire").addEventListener("click", useFire);
    $("#i-blink").addEventListener("click", useBlink);
    $$(".dpad button").forEach(function (b) {
      b.addEventListener("click", function () { var d = b.dataset.d; if (d === "w") wait(); else tryMove(d === "l" ? -1 : d === "r" ? 1 : 0, d === "u" ? -1 : d === "d" ? 1 : 0); });
    });
    // tap on the map: step towards the tapped side
    cv.addEventListener("pointerdown", function (e) {
      var r = cv.getBoundingClientRect(), dx = e.clientX - r.left - (P.rx * T - camX + T / 2), dy = e.clientY - r.top - (P.ry * T - camY + T / 2);
      if (Math.abs(dx) < T / 2 && Math.abs(dy) < T / 2) return wait();
      if (Math.abs(dx) > Math.abs(dy)) tryMove(dx > 0 ? 1 : -1, 0); else tryMove(0, dy > 0 ? 1 : -1);
    });
  }

  function updateUI() {
    if (!P || !$("#u-lv")) return;
    $("#h-depth").textContent = "Depth " + depth;
    $("#u-lv").textContent = "Lv " + P.lvl;
    $("#u-gold").textContent = P.gold + " gold";
    $("#u-hpb").style.width = (P.hp / P.max * 100) + "%"; $("#u-hp").textContent = P.hp + "/" + P.max + " HP";
    $("#u-xpb").style.width = (P.xp / P.next * 100) + "%"; $("#u-xp").textContent = P.xp + "/" + P.next + " XP";
    $("#u-atk").textContent = P.atk; $("#u-def").textContent = P.def; $("#u-crit").textContent = Math.round(P.crit * 100) + "%";
    $("#i-potn").textContent = P.potions; $("#i-firen").textContent = P.fire; $("#i-blinkn").textContent = P.blink;
    $("#i-pot").disabled = !P.potions; $("#i-fire").disabled = !P.fire; $("#i-blink").disabled = !P.blink;
    $("#u-perks").innerHTML = Object.keys(P.perks).map(function (k) {
      var p = PERKS.filter(function (x) { return x.k === k; })[0];
      return '<span class="perk" title="' + esc(p.n + ": " + p.x) + '">' + p.i + (P.perks[k] > 1 ? "<b>" + P.perks[k] + "</b>" : "") + "</span>";
    }).join("") || '<span class="dim" style="font-size:12px">Level up to choose perks.</span>';
  }
  function renderLog() {
    var el = $("#u-log"); if (!el) return;
    el.innerHTML = log.slice(-6).map(function (l) { return '<p class="' + l.c + '">› ' + esc(l.t) + "</p>"; }).join("");
  }

  function openModal(html) { modal.innerHTML = html; modal.hidden = false; modal.onkey = null; }
  function closeModal() { modal.hidden = true; modal.innerHTML = ""; modal.onkey = null; }

  $("#b-notes").addEventListener("click", function () {
    if (!modal.hidden && !modal.dataset.notes) return;
    openModal('<div class="mbox" style="text-align:left"><h2 style="color:var(--cyan);text-shadow:0 0 20px rgb(62 240 255 / .5)">How it\'s built</h2><div class="notes"><ul>' +
      "<li><b>Procedural dungeons.</b> Random non-overlapping rooms, joined in order by L-shaped corridors, plus a few extra links so the map has loops. The stairs go in the room farthest from the start by walking distance (BFS).</li>" +
      "<li><b>Field of view.</b> Recursive shadowcasting over 8 octants: each octant scans rows outward and narrows its visible slope range whenever a wall blocks light. Explored tiles are remembered and drawn dimmed.</li>" +
      "<li><b>Shared pathfinding.</b> One BFS “Dijkstra map” from the player is computed per turn; every monster simply steps to the neighbour with the lowest distance. O(map) once instead of A* per monster. Ghosts ignore walls; bats move twice and erratically.</li>" +
      "<li><b>Lighting.</b> A darkness layer on an offscreen canvas has radial holes cut with <code>destination-out</code> for the lantern and torches, then a coloured <code>lighter</code> pass adds warm glow.</li>" +
      "<li><b>Pixel art in code.</b> Sprites are 8×8 strings with a palette, baked once to tiny canvases (plus a white copy for hit-flash) and scaled with smoothing off.</li>" +
      "<li><b>Turns vs. frames.</b> Game logic is strictly turn-based on grid coordinates; rendering runs every frame and eases positions, bumps, particles and floating numbers toward the logical state.</li></ul></div>" +
      '<button class="btn" id="m-close" type="button" style="justify-self:center">Close</button></div>');
    modal.dataset.notes = "1";
    $("#m-close").addEventListener("click", function () { delete modal.dataset.notes; closeModal(); });
  });

  document.addEventListener("keydown", function (e) {
    if (!modal.hidden) {
      if (modal.onkey) modal.onkey(e);
      if (e.key === "Escape" && modal.dataset.notes) { delete modal.dataset.notes; closeModal(); }
      return;
    }
    if (!P || !map || !cv) return;
    var k = e.key;
    var mv = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0], k: [0, -1], j: [0, 1], h: [-1, 0], l: [1, 0] }[k];
    if (mv) { e.preventDefault(); tryMove(mv[0], mv[1]); }
    else if (k === " " || k === ".") { e.preventDefault(); wait(); }
    else if (k === "1") usePotion(); else if (k === "2") useFire(); else if (k === "3") useBlink();
  });
  window.addEventListener("resize", resize);

  /* ================= title ================= */
  function showTitle() {
    P = null; map = null; cv = null;
    var best = Arcade.best("neoncrypt-depth");
    root.innerHTML = '<div class="title-scr"><div class="sprites" id="t-spr"></div><h1>NEON<br><span>CRYPT</span></h1>' +
      '<p class="dim" style="font-size:18px;max-width:46ch">A turn-based roguelike. Every floor is generated fresh. Light is scarce, monsters move when you move, and every level-up offers a new perk.</p>' +
      '<button class="btn" id="t-start" type="button" style="font-size:19px;padding:14px 30px">▶ Enter the crypt</button>' +
      (best ? '<p class="mono dim">Deepest: depth ' + best + "</p>" : "") +
      '<div class="feat"><div><b>🗺️ Procedural floors</b>Rooms, corridors and loops, new every run.</div><div><b>🔦 Field of view</b>Shadowcasting light and fog of war.</div><div><b>⚔️ 7 monster types</b>Bats, ghosts that walk through walls, and a Lich every 5 floors.</div><div><b>🃏 12 perks</b>Pick one of three each level. Build a different hero every time.</div></div></div>';
    var host = $("#t-spr");
    ["slime", "bat", "player", "ghost", "lich"].forEach(function (k) { var c = document.createElement("canvas"); c.width = c.height = 8; c.getContext("2d").drawImage(SPR[k], 0, 0); host.appendChild(c); });
    $("#t-start").addEventListener("click", newGame);
    $("#h-depth").textContent = "";
  }

  // keep swipes on the canvas from scrolling the page and map them to moves
  document.addEventListener("touchmove", function (e) { if (cv && e.target === cv) e.preventDefault(); }, { passive: false });

  requestAnimationFrame(frame);
  showTitle();
})();
</script>
</body>
